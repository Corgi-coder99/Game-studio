 else if(id==='ngoc_gian_truyen_thua'){if(!s.owned.includes(target))throw new Error('Choose an owned hero.');s.heroXP[target]=Math.min(1000000,(s.heroXP[target]||0)+auctionRules.effects.jadeXP);}
 else if(id==='thu_dan_pham'||id==='thu_dan_huyet_mach'){const pet=id==='thu_dan_pham'?petCatalog[0]:petCatalog.at(-1);if(s.account.pets[pet.id])s.account.petShards[pet.id]=Math.min(goldLimit,(s.account.petShards[pet.id]||0)+(id==='thu_dan_pham'?auctionRules.effects.commonEggShards:auctionRules.effects.bloodlineEggShards));else{s.account.pets[pet.id]=1;s.account.petStars[pet.id]=id==='thu_dan_pham'?1:auctionRules.effects.bloodlineEggStars;}}
 else throw new Error('This material is used in the Celestial Forge.');s.account.bag[id]--;return s;
}
function craftExclusive(state,recipe,random=Math.random){const s=structuredClone(state);initAuction(s);const r=auctionRules.crafts[recipe];if(!r)throw new Error('Unknown recipe.');for(const[id,n]of Object.entries(r.items))if((s.account.bag[id]||0)<n)throw new Error('Missing crafting materials.');auctionPay(s,'gold',r.gold);for(const[id,n]of Object.entries(r.items))s.account.bag[id]-=n;
 if(recipe==='sword'){const pool=itemTemplates.filter(t=>t.grade==='SSR'&&t.slot==='weapon'&&!t.heroId),t=pool[Math.floor(random()*pool.length)];if(!t)throw new Error('No eligible SSR weapon.');s.inventory.push({id:'item-'+s.nextItemId++,templateId:t.id,level:10,bound:true});}
 else if(recipe==='breakthrough'){const success=random()<r.chance+(s.auction.effects.breakthroughBoost||0);s.auction.effects.breakthroughBoost=0;if(success){const id=r.results[Math.floor(random()*r.results.length)];auctionParcel(s,{title:'SSR art breakthrough',asset:{kind:'bag',id,amount:1}});}}
 else auctionParcel(s,{title:'Crafted: '+exclusiveById[r.result].name,asset:{kind:'bag',id:r.result,amount:1}});return s;
}

function applyAuctionAction(state,action,payload={},now=Date.now(),random=Math.random){const backend=new LocalAuctionBackend(random);if(action==='list')return backend.list(state,payload,now);if(action==='bid')return backend.bid(state,payload.id,payload.price,now);if(action==='buyout')return backend.buyout(state,payload.id,now);if(action==='cancel')return backend.cancel(state,payload.id,now);if(action==='claim')return backend.claim(state,payload.id??null);if(action==='use')return useExclusiveItem(state,payload.itemId,payload.heroId,random);if(action==='craft')return craftExclusive(state,payload.recipe,random);throw new Error('Unsupported auction command.');}

const auctionEsc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function exclusiveArt(id){const item=exclusiveById[id];return `<span class="exclusive-art" style="--exclusive-x:${(item?.iconIndex||0)%4*100/3}%;--exclusive-y:${Math.floor((item?.iconIndex||0)/4)*100/3}%;--exclusive-color:${auctionRules.rarities[(item?.rarity||1)-1].color}" role="img" aria-label="${item?.name||'Exclusive item'}"></span>`;}
function auctionRefArt(s,ref){if(exclusiveById[ref.id])return exclusiveArt(ref.id);if(ref.kind==='gear')return equipmentPicture(itemById[ref.item?.templateId||s.inventory.find(i=>i.id===ref.id)?.templateId]);return itemPicture(ref.id);}
function auctionPage(s,tab='active',filters={},selection=null,link=null){const a=s.auction,active=a.listings.filter(l=>l.status==='active'),assets=[...tradeAssets(s),...exclusiveItems.filter(i=>s.account.bag[i.id]>0).map(i=>({kind:'bag',id:i.id,amount:s.account.bag[i.id]}))],selected=selection&&assets.find(r=>r.kind===selection.kind&&r.id===selection.id),info=selected?auctionAssetInfo(s,{...selected,amount:selection.amount||1}):null,now=Date.now(),e=auctionRules.economy;
 let list=active.filter(l=>(!filters.rarity||l.rarity===Number(filters.rarity))&&(!filters.type||l.type===filters.type));if(filters.sort==='price')list.sort((a,b)=>(a.currentBid||a.startPrice)-(b.currentBid||b.startPrice));else list.sort((a,b)=>a.endsAt-b.endsAt);
 function listing(l){return `<article class="market-listing" data-feedback-key="auction-${l.id}" style="--exclusive-color:${auctionRules.rarities[l.rarity-1].color}">${auctionRefArt(s,l.escrow)}<div><h3>${auctionEsc(l.name)} ×${l.quantity}</h3><small>${l.rarity===5?'SSR / Immortal':auctionRules.rarities[l.rarity-1].name} · ${l.sellerId==='player'?'Your listing':auctionRules.npcNames[Number(l.sellerId.slice(4))%auctionRules.npcNames.length]}</small><p><b>${(l.currentBid||l.startPrice).toLocaleString('en-US')}</b> ${l.currency==='jade'?'Immortal Jade':'Spirit Stones'} · Recent: ${a.recent[l.itemId]?.toLocaleString('en-US')||'—'}</p><small data-market-countdown="${l.endsAt}" class="${l.endsAt-now<300000?'ending-soon':''}">${Math.max(0,Math.ceil((l.endsAt-now)/1000))}s left</small></div><footer>${l.sellerId==='player'?`<button data-market-cancel="${l.id}" ${l.currentBidderId?'disabled':''}>Cancel</button>`:`<button data-market-bid-open="${l.id}">${l.currentBidderId==='player'?'Raise Bid':'Bid'}</button><button data-market-buyout="${l.id}" ${l.buyoutPrice===null?'disabled':''}>Buyout ${l.buyoutPrice?.toLocaleString('en-US')||'—'}</button>`}</footer></article>`;}
 let body='';
 if(tab==='active'||tab==='mine')body=`<div class="market-filter"><label>Rarity<select data-market-filter="rarity"><option value="">All rarities</option>${auctionRules.rarities.map((r,i)=>`<option value="${i+1}" ${Number(filters.rarity)===i+1?'selected':''}>${r.name}</option>`).join('')}</select></label><label>Type<select data-market-filter="type"><option value="">All types</option>${['manual','material','egg','consumable','fragment','gear','bag'].map(t=>`<option ${filters.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Sort<select data-market-filter="sort"><option value="ending">Ending soon</option><option value="price" ${filters.sort==='price'?'selected':''}>Lowest price</option></select></label></div><div class="market-listings">${(tab==='mine'?active.filter(l=>l.sellerId==='player'):list).map(listing).join('')||'<p>No listings.</p>'}</div>`;
 if(tab==='sell')body=`<div class="market-sell"><section><h2>Choose an item from your inventory</h2><div class="market-bag">${assets.map(r=>`<button draggable="true" data-market-select="${r.kind}:${r.id}" class="${selected?.id===r.id?'selected':''}">${auctionRefArt(s,r)}<small>${auctionEsc(auctionAssetInfo(s,{...r,amount:1}).name)} ×${r.amount}</small></button>`).join('')}</div></section><aside data-market-drop><h2>${info?auctionEsc(info.name):'Drag an item here or tap it'}</h2><label>Quantity<input id="market-quantity" type="number" min="1" max="${selected?.amount||1}" value="${selection?.amount||1}"></label><button data-market-quantity>Update Quantity</button><label>Starting price<input id="market-price" type="number" min="${Math.max(1,Math.ceil((info?.value||2)*e.minimumPrice))}" value="${Math.max(1,Math.ceil(info?.value||100))}"></label><label>Buyout (optional)<input id="market-buyout" type="number" min="1" placeholder="Leave blank for bidding only"></label><label>Duration<select id="market-hours">${e.durations.map(h=>`<option value="${h}">${h} hours</option>`).join('')}</select></label><p>Listing fee: 2% (not refundable). Sale fee: 7%. Maximum five active listings.</p><button data-market-list ${!info?'disabled':''}>Place in Escrow & List</button><small>Exclusive items are tradable through auction halls only. Learned arts are bound; unused copies can be sold.</small></aside></div>`;
 if(tab==='history')body=`<div class="market-history">${a.history.slice().reverse().map(h=>`<article><b>${auctionEsc(h.name)}</b><p>${h.status} · ${h.finalPrice} · Fee ${h.fee}</p><time>${new Date(h.at).toLocaleString('en-US')}</time></article>`).join('')||'<p>No completed transactions.</p>'}</div>`;
 if(tab==='inbox')body=`<button data-market-claim="all">Claim All Available Rewards</button><p>Items and proceeds remain here until claimed. A full wallet or inventory never discards a reward.</p><div class="market-inbox">${a.inbox.filter(p=>!p.claimed).map(p=>`<article>${p.asset?auctionRefArt(s,p.asset):itemPicture('coins')}<div><b>${auctionEsc(p.title)}</b><p>${p.heroXP?p.heroXP.amount+' Hero EXP':p.asset?'×'+p.asset.amount:p.amount+' '+(p.currency==='essence'?'Enhancement Essence':p.currency==='jade'?'Immortal Jade':'Spirit Stones')}</p></div><button data-market-claim="${p.id}">Claim</button></article>`).join('')||'<p>Your inbox is empty.</p>'}</div>`;
 if(tab==='forge')body=`<div class="market-forge">${Object.entries(auctionRules.crafts).map(([id,r])=>`<article><h2>${{tribulation:'Tribulation Pill',fragments:'Azure Sword Scripture',breakthrough:'SSR Art Breakthrough',sword:'Level-10 SSR Weapon'}[id]}</h2><p>${Object.entries(r.items).map(([k,n])=>`${exclusiveById[k].name} ×${n} (${s.account.bag[k]||0} owned)`).join('<br>')}<br>${r.gold} Spirit Stones</p>${r.chance?`<p>Success: ${Math.min(1,r.chance+(a.effects.breakthroughBoost||0))*100}%. Materials and the one-use boost are consumed on an attempt.</p>`:''}<button data-market-craft="${id}">Craft / Attempt</button></article>`).join('')}</div>`;
 if(tab==='items')body=`<div class="market-item-library">${exclusiveItems.map(i=>`<article>${exclusiveArt(i.id)}<h3>${i.name}${i.grade==='SSR'?' · SSR':''}</h3><p>${i.effect}</p><small>Sources: ${i.sources.join(', ')} · Owned: ${s.account.bag[i.id]||0}</small>${i.type!=='material'&&i.type!=='fragment'?`<button data-market-use="${i.id}" ${(s.account.bag[i.id]||0)<1?'disabled':''}>${i.type==='manual'?'Learn Art':'Use Item'}</button>`:''}</article>`).join('')}</div><label>Hero for Inheritance Jade Slip<select id="market-hero">${s.owned.map(id=>`<option value="${id}">${id}</option>`).join('')}</select></label><button data-view="inheritance">Equip Learned Arts</button>`;
 return `<section class="fixed-screen auction-screen"><header class="gallery-heading"><h1>Celestial Auction Hall</h1><span>${s.commerce.gold.toLocaleString('en-US')} Spirit Stones · ${s.coins.toLocaleString('en-US')} Immortal Jade</span><button data-peer-auction>Nearby Player Auctions</button><button data-view="city">Close</button></header><nav class="market-tabs">${[['active','Active Auctions'],['mine','My Listings'],['sell','List Item'],['history','History'],['inbox','Inbox ('+a.inbox.filter(p=>!p.claimed).length+')'],['forge','Forge'],['items','Exclusive Items']].map(([id,label])=>`<button data-market-tab="${id}" class="${tab===id?'selected':''}">${label}</button>`).join('')}</nav><div class="market-content">${body}</div></section>`;

function auctionBidDialog(s,id){const l=s.auction.listings.find(l=>l.id===id&&l.status==='active');if(!l)return'';const price=minimumAuctionBid(l);return `<div class="description-curtain market-bid-curtain"><section class="market-bid-dialog" role="dialog" aria-label="Place auction bid"><h2>Bid: ${auctionEsc(l.name)}</h2><p>Balance: ${l.currency==='jade'?s.coins:s.commerce.gold} · Held bid: ${l.currentBidderId==='player'?l.currentBid:0}</p><label>Your bid<input id="market-bid-price" type="number" min="${price}" value="${price}"></label><button data-market-bid-step="${id}">+ Minimum Step</button><p>Seller pays a 7% sale fee. Late bids extend the auction by 60 seconds, up to five times.</p><button data-market-bid-confirm="${id}">Confirm Bid</button><button data-market-bid-close>Cancel</button></section></div>`;}

  const s = skills[unit.id], b = state.battle, recent = b.events.findLast(e => e.actor === unit.id && e.side === unit.side && b.clock - e.at < 1);
  return `<div class="combat-unit ${unit.hp <= 0 ? 'fallen' : ''} ${recent ? `casting fx-${s.fx}` : ''}">${unit.beastKind?wildlifeArt(unit.beastKind):portrait(unit.id)}<div class="unit-main"><b>${unit.name}</b><div class="unit-bars"><meter value="${unit.hp}" max="${unit.maxHp}" aria-label="Sinh lực ${unit.name}"></meter><span>${Math.ceil(unit.hp)} / ${unit.maxHp}${unit.shield ? ` · Khiên ${unit.shield}` : ''}</span>${!enemy ? `<progress value="${unit.energy}" max="100" aria-label="Nộ khí ${unit.name}"></progress>` : ''}</div><div class="status-line">${unit.burn ? '🔥 Thiêu đốt ' : ''}${unit.marked ? '◉ Thiên nhãn ' : ''}${unit.stun ? '★ Choáng ' : ''}${unit.slow?'↓ Chậm ':''}${unit.manaLock?'M↓ Hồi mana chậm ':''}${unit.immune>0?'⛨ Miễn sát thương ':''}${unit.invincible>0?'✧ Vô địch ':''}${unit.boost ? '↑ Công ' : ''}${unit.exposed ? '↓ Giáp' : ''}</div></div>${!enemy ? `<button class="skill-button ${unit.energy >= 100 ? 'ready' : ''}" data-cast="${unit.key}" title="${s.name}: ${s.text}" ${b.winner || state.paused || unit.hp <= 0 || unit.energy < 100 || unit.stun > 0 ? 'disabled' : ''}><span>${unit.energy >= 100 ? '✦' : unit.energy}</span><small>${s.name}</small></button>` : ''}</div>`;
}
function battleLocation(b){if(b.mode==='stronghold')return{name:b.strongholdName||'World Stronghold'};return b.mode==='secret'?{name:secretRealms.find(r=>r.id===b.secretId).bossName}:b.mode==='campaign'?campaignNode(b.stage,b.encounter||1):b.mode==='hunt'?wildlifeNodes.find(t=>t.id===b.wildId):b.mode==='bot'?botCities.find(t=>t.id===b.botId):worldNodes.find(t=>t.id===b.nodeId)||{name:b.nodeId||'Battle'};}
function battlePanel() {
  const b = state.battle, node = battleLocation(b), event = b.events.findLast(e => e.kind !== 'attack' && b.clock - e.at < 2);
  return `<div class="panel-heading"><span class="eyebrow">GIAO CHIẾN · ${b.clock}s / 180s</span><button class="mini-button" data-pause>${state.paused ? '▶ Tiếp tục' : 'Ⅱ Tạm dừng'}</button></div><h2>${b.winner ? b.winner === 'ally' ? 'Chiến thắng!' : b.winner === 'retreat' ? 'Đã rút quân' : 'Thất bại' : node.name}</h2>${b.winner ? `<div class="${b.winner === 'ally' ? 'success-note' : 'warning-note'}">${b.winner === 'ally' ? b.mode==='campaign'?'Đã tự nhận thưởng chiến dịch và mở màn tiếp theo.':'Đã nhận linh ngọc và tài nguyên. Quân sống sót đang trở về.' : 'Quân sống sót đang trở về. Hãy nâng doanh trại, đổi linh long hoặc đội hình.'}</div>` : '<p>Hai phe hành động theo thứ tự ô đội hình. Chọn kỹ năng để xếp cho lượt tới của tướng; cần đủ mana/nộ và hết hồi chiêu.</p>'}<div class="damage-summary"><b>Báo cáo sát thương cả trận</b><p>Vật lý: ${b.damageStats?.physical||0} · Phép: ${b.damageStats?.magic||0}<br>Chuẩn: ${b.damageStats?.pure||0}<br>Khiên hấp thụ: ${b.damageStats?.absorbed||0} · Bạo kích: ${b.damageStats?.criticals||0}<br>Chặn: ${fmt(b.damageStats?.blocked||0)} · Phản: ${fmt(b.damageStats?.reflected||0)} · Hồi: ${fmt(b.damageStats?.healing||0)}<br>THẦN: ${b.damageStats?.divine||0} · Buff bị xóa: ${b.damageStats?.dispelled||0}<br>Hồi sinh: ${b.damageStats?.revives||0} · Kết liễu: ${b.damageStats?.executions||0}</p><small>Damage = Công × hệ số × 100/(100+phòng thủ) × lực lượng còn lại × buff/khắc chế; bạo kích ×1,5. Công thức của bản thử.</small></div><div class="battle-enemies">${b.enemies.map(u => unitRow(u, true)).join('')}</div><div class="battle-separator">⚔ ĐỘI VIỄN CHINH ⚔</div><div class="battle-allies">${b.allies.map(u => unitRow(u)).join('')}</div><div class="battle-controls"><button class="outline-button ${state.autoSkill ? 'enabled' : ''}" data-auto aria-pressed="${state.autoSkill}">Tự dùng kỹ năng: ${state.autoSkill ? 'BẬT' : 'TẮT'}</button><span class="dragon-energy">${elementalDragonArt(state.dragon)} ${state.dragon} long ${b.dragonEnergy}%</span></div>${event ? `<div class="skill-announcement fx-${event.kind}" role="status">${event.text}</div>` : ''}<div class="combat-bonds">${activeBonds(state.team).map(b => `<span>⛓ ${b.name}</span>`).join('')}</div><details class="combat-log"><summary>Nhật ký trận đấu</summary>${b.log.slice(-12).map(l => `<p>${l}</p>`).join('')}</details>${state.march && state.march.stage !== 'returning' ? '<button class="text-button" data-recall>Rút quân về thành</button>' : ''}`;
}
function realmLegend(){return `<div class="realm-legend">${Object.entries(realmFactions).map(([id,f])=>`<span style="--realm:${f.color}">● ${f.name} · ${f.troopName}</span>`).join('')}</div>`;}
function nodePanel() {
  if(state.battle&&state.march?.stage==='combat')return `<h2>Đang giao chiến</h2><button class="gold-button full" data-view="combat">Mở chiến trường</button>`;
  const n = worldNodes.find(n => n.id === selectedNode), m = state.march;
  return `<div class="panel-heading"><span class="eyebrow">THẾ GIỚI / THANH VÂN</span><span class="pill">${n.type === 'camp' ? 'PVE · CẤP ' + n.level : 'TÀI NGUYÊN'}</span></div><div class="location-art ${n.type === 'camp' ? 'enemy-location' : ''}"><span>${n.type === 'camp' ? '⚑' : n.type === 'food' ? '♧' : n.type === 'wood' ? '♠' : n.type === 'home' ? '♜' : '◆'}</span></div><h2>${n.name}</h2><p>${n.type === 'camp' ? 'Đưa 1–5 tướng cùng 60 binh lính đến giao chiến tự động. Phối hợp kỹ năng để phá trận.' : n.type === 'home' ? 'Thành trì của bạn. Xây dựng để phát triển quân lực.' : 'Đưa 60 quân đi thu thập. Nhận 500 ' + resourceName[n.type] + ' sau 20 giây tại điểm này.'}</p>${n.type === 'camp' ? `<div class="enemy-preview">${n.enemies.map(id => portrait(id)).join('')}</div><div class="info-row"><span>Thưởng linh ngọc</span><b>${state.cleared.includes(n.id) ? 60 * n.level : 200 * n.level}</b></div><div class="info-row"><span>Thưởng tài nguyên</span><b>${150 * n.level} lương · ${100 * n.level} gỗ</b></div><small class="muted">Thắng hao hụt 20% quân, thua 50%. Không mất tướng.</small>` : ''}${n.type === 'home' ? '<button class="gold-button full" data-view="city">Về thành trì</button>' : `<button class="gold-button full" data-dispatch="${n.id}" ${m || !state.team.length || state.troops < 60 || state.regiments[state.troopType] < 60 ? 'disabled' : ''}>${n.type === 'camp' ? '⚔ Xuất chinh' : '⚑ Thu thập'} · 60 quân</button>`}${m ? `<div class="march-status"><b>${worldNodes.find(n => n.id === m.nodeId).name}</b><p>${{ marching: 'Đang hành quân', gathering: 'Đang thu thập', combat: 'Đang giao chiến', returning: 'Đang trở về' }[m.stage]} · ${Math.ceil(m.duration - m.progress)} giây</p><button class="outline-button full" data-recall ${m.stage === 'returning' ? 'disabled' : ''}>Gọi quân về</button></div>` : ''}${!m?'<section class="subpanel"><h3>Chọn binh chủng</h3>'+troopSelection()+'</section>':''}<section class="subpanel"><h3>Địa điểm</h3><div class="building-list">${worldNodes.filter(n => n.id !== 'home').map(n => `<button data-node="${n.id}" class="${selectedNode === n.id ? 'chosen' : ''}"><span>${n.type === 'camp' ? '⚑' : '♧'} ${n.name}</span><b>${n.type === 'camp' ? 'Lv.' + n.level : '+500'}</b></button>`).join('')}</div></section><section class="subpanel"><h3>Thành Tam Quốc</h3>${selectedRealmCity?`<p>Đang xem ${realmCities.find(c=>c.id===selectedRealmCity).name} · ${realmFactions[realmCities.find(c=>c.id===selectedRealmCity).faction].name}</p>`:''}<div class="realm-city-list">${realmCities.map(c=>`<button data-realm-city="${c.id}" style="--realm:${realmFactions[c.faction].color}">${c.name}</button>`).join('')}</div></section>`;
}
function queueCards() {
  const job=state.construction,jobs=trainingJobs(state),t=jobs[0],m=state.march;
  return `<button class="queue-item" data-building="${job?.id||'hall'}"><span>⚒</span><div><b>Xây dựng ${job?'1/1':'0/1'}</b><small>${job?structures.find(b=>b.id===job.id).name+' · '+Math.max(0,Math.ceil((job.endsAt-Date.now())/1000))+'s':'Thợ xây sẵn sàng'}</small></div></button><button class="queue-item" data-building="barracks" data-variant="${t?.type||trainingType}"><span>⚑</span><div><b>Huấn luyện ${jobs.length}/4</b><small>${t?jobs.map(j=>troopTypes[j.type].name.replace(' binh','')+' '+Math.max(0,Math.ceil((j.endsAt-Date.now())/1000))+'s').join(' · '):state.troops+' quân trong thành'}</small></div></button><button class="queue-item" data-view="${m?.stage==='combat'?'combat':'world'}"><span>♞</span><div><b>${m?{marching:'Đang hành quân',combat:'Đang giao chiến',gathering:'Đang thu thập',returning:'Đang trở về'}[m.stage]:'Đạo quân 0/1'}</b><small>${m?worldNodes.find(n=>n.id===m.nodeId).name:'Sẵn sàng xuất chinh'}</small></div></button>`;
}
function combatCommanderButtons(u,b){const h=characterById[u.id],abilities=u.abilities||h.skills;return `<div class="battle-commander"><button class="combat-portrait" data-description="hero:${u.id}">${portrait(u.id)}<b>${u.name}</b></button><button class="combat-skill ${u.canCast?'ready':''} ${u.hp<=0?'fallen':''}" data-cast="${u.key}" data-skill-index="0" ${!u.canCast||b.winner||state.paused?'disabled':''}><span class="skill-name">${b.pendingSkills?.[u.key]!==undefined?'Đã xếp lượt':'Xếp chiêu 1'}</span><span class="resource-readout">${u.resourceLabel} ${fmt(u[u.resource])}/${fmt(u.resource==='mana'?u.manaMax:u.rageMax)}</span><progress max="100" value="${u.energy}"></progress></button><div class="battle-extra-skills">${abilities.map((ability,i)=>{const ready=u.readySkills?.[i],cd=u.skillCooldowns?.[i]||0;return `<div class="battle-ability-slot"><button data-description="${i>=h.skills.length?'manual:'+ability.id:'skill:'+h.id+':'+i}" title="${ability.name}">${skillIcon(ability)}</button>${i?`<button class="battle-extra-skill ${ready?'ready':''}" data-cast="${u.key}" data-skill-index="${i}" ${!ready||b.winner||state.paused?'disabled':''}>${cd>0?Math.ceil(cd)+'s':'Xếp '+(i+1)}</button>`:'<small>Chiêu 1</small>'}</div>`;}).join('')}</div></div>`;}
function combatOverlay() {
  const b=state.battle;if(!b)return '';
  const hp=units=>Math.ceil(units.reduce((n,u)=>n+u.hp,0));const last=b.events.findLast(e=>e.kind!=='attack'&&b.clock-e.at<2);
  return `<div class="fight-score"><div><b>THIÊN MỆNH</b><span>${hp(b.allies)} HP · ${troopTypes[b.troopType].name} · Lv.${b.armyLevel||1}</span></div><strong>⚔<small>${b.turn?(b.mode==='campaign'?'Đợt '+(b.encounter||1)+'/3 · ':b.mode==='stronghold'?'Wave '+(b.wave||1)+'/'+b.waveCount+' · ':'')+'Lượt '+b.turn.round+' · ':''}${Math.floor(b.clock)} / 180s</small></strong><div><b>${battleLocation(b).name.toUpperCase()}</b><span>${hp(b.enemies)} HP · ${b.mode==='hunt'?'Động vật hoang dã':troopTypes[b.enemyTroopType]?.name||'Quân địch'}</span></div></div>${last?`<div class="combat-message ${last.kind==='combo'?'is-combo':''}">${last.text}</div>`:''}<div class="combat-bottom"><div class="combat-options"><button data-auto class="${state.autoSkill?'enabled':''}">Tự chiêu ${state.autoSkill?'BẬT':'TẮT'}</button><button data-speed>Tốc độ ×${speed}</button><button data-pause>${state.paused?'▶ Tiếp tục':'Ⅱ Dừng'}</button><button data-recall ${!(state.march||state.worldAI.expedition||b.mode==='secret')||(state.march?.stage||state.worldAI.expedition?.stage)==='returning'?'disabled':''}>Rút quân</button><button data-view="${b.mode==='campaign'?'campaign':(b.mode==='bot'||b.mode==='hunt'||b.mode==='stronghold'||b.mode==='secret')?'region':'world'}">${b.mode==='campaign'?'Chiến dịch':'Bản đồ'}</button>${b.mode==='campaign'?`<button data-campaign-auto>Tự nối ${state.campaign.autoAdvance?'BẬT':'TẮT'}</button><button data-campaign-stop>Dừng vượt ải</button>`:''}${b.mode==='bot'?'<button data-report>Báo cáo</button>':''}</div><div class="skill-dock">${b.allies.map(u=>combatCommanderButtons(u,b)).join('')}<div class="dragon-charge">${elementalDragonArt(b.dragon||state.dragon)}<b>${b.dragon||state.dragon} long</b><small>${b.dragonEnergy}% nộ</small></div></div></div>${b.mode==='campaign'&&b.winner?`<div class="campaign-status-banner"><b>${b.winner==='ally'?'✓ Đã vượt màn '+b.stage+' · Đã nhận thưởng':b.winner==='enemy'?'Đội hình chưa vượt được màn này':'Đã dừng chiến dịch'}</b><span>${b.winner==='ally'&&(state.campaign.autoAdvance||state.campaign.autoReplay)?'Đang tự chuyển ải tiếp theo…':'Điều chỉnh đội hình hoặc trở về chiến dịch.'}</span><button data-view="campaign">Chiến dịch</button></div>`:''}${b.winner&&!resultDismissed&&b.mode!=='campaign'?`<div class="combat-result" role="dialog" aria-label="Kết quả trận"><span class="result-crown">${b.winner==='ally'?'♛':'⚑'}</span><h2>${b.winner==='ally'?'Chiến thắng!':b.winner==='retreat'?'Đã rút quân':'Thất bại'}</h2><p>${b.mode==='stronghold'?'Rewards reach the Reward Inbox when surviving troops return.':b.rewardInMail?'Toàn bộ chiến lợi đang chờ nhận trong Hộp thư → Chiến lợi bí cảnh.':b.reward?`${b.reward.gold?b.reward.gold+' vàng · ':''}◈ ${b.reward.coins} linh ngọc · ${b.reward.food} lương · ${b.reward.wood} gỗ${b.reward.playerXP?' · '+b.reward.playerXP+' EXP quân vương':''}`:b.winner==='ally'?'Đang tổng kết phần thưởng…':'Hãy đổi đội hình, binh chủng hoặc linh long rồi thử lại.'}</p>${b.casualties?`<p>${b.casualties.wounded} quân bị thương · ${b.casualties.dead} tử trận</p><button data-view="medical">Linh Dược Viện · Cứu thương</button>`:''}<p>Element advantages: ${b.elementStats?.advantages||0} · Guarded hits: ${b.elementStats?.guards||0} · Team: ${b.teamSynergy?.effect||'None'}</p>${b.mode==='stronghold'?`<button data-stronghold-next="${b.strongholdId}">Continue · Nearest Same-Level Target</button><button data-advisor-target="${b.strongholdId}">Try Formation Advice</button>`:''}<button class="gold-button" data-result-close>Trở về bản đồ</button><button class="outline-button" data-view="mail" ${b.rewardInMail?'data-open-parcels':''}>${b.rewardInMail?'Nhận chiến lợi trong hộp thư':'Xem phân tích chiến đấu'}</button></div>`:''}`;
}
function mapPage() {
  return `<div class="map-layout"><section class="map-scene"><canvas id="world-map" role="img" aria-label="Thành phố và chiến trường pixel. Có thể kéo, thu phóng và chọn công trình."></canvas>${view==='region'?regionToolbar(state,speed):''}${['world','region'].includes(view)?`<nav class="world-layer-switch"><button data-view="world" class="${view==='world'?'selected':''}">Bản đồ tổng quan</button><button data-view="region" class="${view==='region'?'selected':''}">Cận cảnh · Thành & tài nguyên</button></nav>`:''}${view!=='combat'?`<div class="account-map-links"><button data-view="profile">${navArt("profile")}<small>Người chơi</small></button><button data-view="pets">${navArt("pets")}<small>Thú cưng</small></button></div><div class="queue-stack" id="queue-stack">${queueCards()}</div>${view==='world'?realmLegend():''}<div class="city-title" ${view==='region'?'hidden':''}><span>${view==='city'?'THIÊN MỆNH THÀNH':'THANH VÂN ĐẠI LỤC'}</span><small>${view==='city'?'Lãnh địa của bạn':'PvE · '+state.cleared.length+'/3 trại đã chinh phục'}</small></div><div class="event-dock settings-dock"><button data-view="settings" title="Settings"><span class="settings-gear" aria-hidden="true">⚙</span><small>Settings</small></button></div><div class="quest-panel"><span>✧</span><div><b>Con đường quân vương</b><p>${state.levels.hall===1?'Nâng Đại điện lên cấp 2':!state.cleared.length?'Chinh phục trại Hoàng Cân':'Kết hợp anh hùng, chinh phục Hổ Lao Quan'}</p></div><button data-view="quests">→</button></div><div class="world-switch"><button data-view="${view==='city'?'region':'city'}" aria-label="${view==='city'?'Mở bản đồ thế giới':'Về thành trì'}">${view==='city'?'⌖':'♜'}</button><small>${view==='city'?'Thế giới':'Thành trì'}</small></div><div class="map-tools"><button data-zoom="-1" aria-label="Thu nhỏ">−</button><button data-center aria-label="Căn giữa">⌖</button><button data-zoom="1" aria-label="Phóng to">＋</button><button data-open-panel>${view==='city'?'Công trình':'Địa điểm'}</button>${view==='world'?'<button data-view="region">Khu vực quanh thành →</button>':''}</div>`:'<div id="combat-overlay">'+combatOverlay()+'</div>'}</section><aside class="detail-panel ${drawerOpen?'is-open':''}" id="details" role="dialog" aria-label="Thông tin công trình và đội quân" ${drawerOpen?'':'hidden'}><button class="close-drawer" data-close-panel aria-label="Đóng thông tin">×</button><div id="panel-content">${drawerOpen?(['city','building'].includes(view)?buildingPanel():view==='combat'?battlePanel():view==='region'?regionPanel(state,selectedRegionEntity):nodePanel()):''}</div></aside></div>`;

function nearestProvince(x,y){return realmCities.reduce((a,c)=>Math.hypot(c.x-x,c.y-y)<Math.hypot(a.x-x,a.y-y)?c:a,realmCities[0]);}

const roomProtocol=12;

function roomHeldGold(r,id){return r.auctions.filter(a=>a.status==='open'&&a.bidder===id).reduce((n,a)=>n+a.bid,0);}
function roomHeldAsset(r,id,kind,key){return [...r.auctions.filter(a=>a.status==='open'&&a.seller===id),...r.trades.filter(t=>t.status==='pending'&&t.seller===id)].reduce((n,x)=>n+(x.asset.kind===kind&&x.asset.id===key?x.asset.amount:0),0);}

function roomBattle(attacker,defender){const node={id:'peer',siege:true,name:defender.account.name,level:1,enemies:defender.team};const b=createTacticsBattle(attacker,node),d=createTacticsBattle(defender,{id:'peer-defense',siege:true,name:'Trấn thủ',level:1,enemies:attacker.team});b.enemies=d.allies.map(u=>({...u,side:'enemy',key:'enemy-'+u.slot}));b.turn.order=[];for(let slot=0;slot<9;slot++)for(const side of ['ally','enemy'])if(b[side==='ally'?'allies':'enemies'].some(u=>u.slot===slot))b.turn.order.push(side+'-'+slot);b.turn.index=0;b.turn.remaining=.4;b.mode='peer';return b;}
function roomCommand(room,actor,command,now=Date.now()){if(room.closed)throw new Error('Phòng đã đóng.');if(!command||typeof command.id!=='string'||command.id.length>90||!command.id.startsWith(actor+':'))throw new Error('Mã lệnh không hợp lệ.');if(room.seen.includes(command.id))return room;const r=structuredClone(room),s=roomPlayer(r,actor),c=command;r.now=now;

 else if(c.action==='exchange'){r.players[actor].state=exchangeMaterials(s,c.kind,c.lots,c.direction);}
 else if(c.action==='list'){if(r.auctions.filter(a=>a.seller===actor&&a.status==='open').length>=12)throw new Error('Tối đa 12 vật phẩm đang đấu giá.');const info=assetInfo(s,c.asset,{auction:true});if(!Number.isInteger(c.price)||c.price<info.min||c.price>info.max)throw new Error(`Giá từ ${info.min} đến ${info.max} vàng.`);const asset=takeAsset(s,c.asset,{auction:true});r.auctions.push({id:r.nextId++,seller:actor,asset,name:info.name,min:info.min,max:info.max,start:c.price,bid:0,bidder:null,endsAt:now+60000,status:'open'});}
 else if(c.action==='bid'){const a=r.auctions.find(a=>a.id===c.auction);if(!a||a.status!=='open'||now>=a.endsAt||a.seller===actor||a.bidder===actor)throw new Error('Không thể đặt giá.');const min=a.bid?Math.min(a.max,a.bid+Math.max(1,Math.ceil(a.bid*.05))):a.start;if(!Number.isInteger(c.price)||c.price<min||c.price>a.max||a.bid===a.max)throw new Error(`Giá tiếp theo ${min}–${a.max}.`);payGold(s,c.price);if(a.bidder)addGold(roomPlayer(r,a.bidder),a.bid);a.bidder=actor;a.bid=c.price;}
 else if(c.action==='cancel-list'){const a=r.auctions.find(a=>a.id===c.auction);if(!a||a.seller!==actor||a.status!=='open'||a.bidder)throw new Error('Chỉ hủy khi chưa có người đặt giá.');roomRefundAuction(r,a);}

function localSky(date=new Date()){const hour=date.getHours()+date.getMinutes()/60,day=hour>=6&&hour<18,twilight=hour>=5&&hour<7||hour>=17&&hour<19;return{hour,day,twilight,darkness:day?0:twilight?.12:.28,progress:day?(hour-6)/12:((hour+6)%24)/12};}

function drawConnectedGate(ctx,iso,x,y,time){const a=iso(x-2.5,y),b=iso(x+2.5,y),c=iso(x,y),height=140;function poly(p,fill){ctx.fillStyle=fill;ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();} // One gate and wall plane share the exact same isometric edge.
 poly([[a[0],a[1]+20],[b[0],b[1]+20],[b[0]-75,b[1]+60],[a[0]-75,a[1]+60]],'#a4a58b');
 for(const[t0,t1]of [[0,.32],[.68,1]]){const p0=[a[0]+(b[0]-a[0])*t0,a[1]+(b[1]-a[1])*t0],p1=[a[0]+(b[0]-a[0])*t1,a[1]+(b[1]-a[1])*t1];poly([[p0[0],p0[1]-height],[p1[0],p1[1]-height],[p1[0],p1[1]+20],[p0[0],p0[1]+20]],'#8c9a91');ctx.strokeStyle='#62736b';ctx.lineWidth=1;for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(p0[0],p0[1]-height+i*27);ctx.lineTo(p1[0],p1[1]-height+i*27);ctx.stroke();}}
 poly([[a[0],a[1]-height],[b[0],b[1]-height],[b[0],b[1]-height+45],[a[0],a[1]-height+45]],'#a9b0a0');
 poly([[a[0]-18,a[1]-height-20],[b[0]+18,b[1]-height-20],[b[0]+38,b[1]-height-50],[a[0]+2,a[1]-height-65]],'#2b655e');poly([[a[0]+2,a[1]-height-65],[b[0]+38,b[1]-height-50],[b[0]+12,b[1]-height-82],[a[0]+20,a[1]-height-83]],'#4c8b75');ctx.strokeStyle='#e0bc60';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a[0]-18,a[1]-height-20);ctx.lineTo(b[0]+18,b[1]-height-20);ctx.stroke();for(const t of [.2,.8]){const px=a[0]+(b[0]-a[0])*t,py=a[1]+(b[1]-a[1])*t-height+50;ctx.fillStyle='#d7a34d';ctx.fillRect(px,py,10,23);ctx.fillStyle='#db6544';ctx.fillRect(px+2,py+3,6,17);} }

function drawProvinceProp(ctx,index,x,y,width){const img=cachedImage('assets/province-props-pixel.png');if(!img.complete||!img.naturalWidth)return;const sw=img.naturalWidth/4,sh=img.naturalHeight/2;ctx.drawImage(img,index%4*sw,Math.floor(index/4)*sh,sw,sh,x-width/2,y-width+12,width,width);}
function dragonFrame(time){return Math.floor(Math.max(0,time)*5)%4;}
function drawFlyingDragon(ctx,element,x,y,size,time){const img=cachedImage('assets/dragon-flight-pixel.png');if(!img.complete||!img.naturalWidth)return;const sw=img.naturalWidth/7,sh=img.naturalHeight/4,index=Math.max(0,elementNames.indexOf(element));ctx.save();ctx.translate(x,y+Math.sin(time*Math.PI*2.5)*size*.025);ctx.rotate(Math.sin(time*2.1)*.035);const frame=dragonFrame(time);for(let strip=0;strip<24;strip++){const t=strip/24,offset=Math.sin(time*7-t*5)*size*.014*(1-t);ctx.drawImage(img,index*sw+t*sw,frame*sh,sw/24,sh,-size/2+t*size,-size/2+offset,size/24+.3,size);}ctx.restore();}
function drawCivilian(ctx,row,x,y,size,time,facing=1){const img=cachedImage('assets/village-motion-pixel.png');if(!img.complete||!img.naturalWidth)return;const sw=img.naturalWidth/4,sh=img.naturalHeight/3,frame=Math.floor(Math.max(0,time)*6)%4;ctx.save();ctx.translate(x,y);ctx.scale(facing,1);ctx.drawImage(img,frame*sw,row*sh,sw,sh,-size/2,-size,size,size);ctx.restore();}

const regionTerrainBounds={x:-1900,y:-800,width:3800,height:2600};

// Fit the whole city at minimum zoom; keep terrain and buildings in one camera space.
function cityCameraLayout(width,height,camera={},touch=false){
 const top=touch?105:145,bottom=touch?85:125,availableWidth=Math.max(1,width-90),availableHeight=Math.max(1,height-top-bottom),zoom=Math.max(1,Math.min(3,camera.zoom||1)),base=Math.max(.01,Math.min(availableWidth/3168,availableHeight/1584)),z=base*zoom,maxX=Math.max(0,(3168*z-availableWidth)/2),maxY=Math.max(0,(1584*z-availableHeight)/2),x=Math.max(-maxX,Math.min(maxX,camera.x||0)),y=Math.max(-maxY,Math.min(maxY,camera.y||0));
 const side=Math.max(4096,width/base,height/base),terrain={x:-side/2,y:492-side/2,width:side,height:side};
 return{z,ox:width/2+x,oy:top+availableHeight/2-492*z,x,y,zoom,maxX,maxY,terrain};
}

// The minimum scale covers the entire canvas; panning never reveals the image edge.
function regionCameraLayout(width,height,camera={}){
 const bounds=regionTerrainBounds,zoom=Math.max(1,Math.min(3,camera.zoom||1)),z=Math.max(width/bounds.width,height/bounds.height)*zoom,centerX=width/2,centerY=height/2+35-370*z,minOx=width-(bounds.x+bounds.width)*z,maxOx=-bounds.x*z,minOy=height-(bounds.y+bounds.height)*z,maxOy=-bounds.y*z,ox=Math.max(minOx,Math.min(maxOx,centerX+(camera.x||0))),oy=Math.max(minOy,Math.min(maxOy,centerY+(camera.y||0)));

function medicalPage(s,type='shield',requested=20){const m=s.medical,q=m.queue,n=Math.min(Math.max(1,requested),m.wounded[type]||1),cost=healingQuote(s,type,n);return `<section class="fixed-screen civic-screen medical-screen"><header class="gallery-heading"><h1>Linh Dược Viện</h1><span><b data-wounded-total>${woundedTotal(s)}</b> / ${infirmaryCapacity(s)} giường · Đã cứu ${civicFmt(m.healed)} · Tử trận ${civicFmt(m.dead)}</span><button data-building-management="infirmary">Nâng viện · Cấp ${s.levels.infirmary}</button><button data-view="city">Về thành</button></header><div class="civic-layout"><section class="medical-illustration">${provincePicture(3,'Linh Dược Viện')}<h2>Dưỡng thương, tái xuất chiến trường</h2><p>75% tổn thất được tiếp nhận nếu còn giường; phần còn lại tử trận. Tháp không dùng quân dự bị nên không tạo thương binh.</p><nav class="patient-types">${Object.entries(civicTroops).map(([id,name])=>`<button data-medical-type="${id}" class="${id===type?'selected':''}"><b>${name}</b><span>${m.wounded[id]} thương binh</span></button>`).join('')}</nav></section><aside>${q?`<h2>Đang cứu chữa ${q.amount} ${civicTroops[q.type]}</h2><p>Đã dùng ${q.food} thức ăn · ${q.wood} gỗ.</p><p>Còn <b data-healing-countdown>${Math.max(0,Math.ceil((q.endsAt-Date.now())/1000))}</b> giây</p><div class="healing-pulse">✚</div><p>Hoàn tất sẽ trả đúng số binh lính này về kho dự bị. Không thể xếp trùng lượt chữa.</p>`:`<h2>${civicTroops[type]} · ${m.wounded[type]} bị thương</h2><label>Số quân cứu chữa<input id="healing-amount" type="number" min="1" max="${m.wounded[type]||1}" value="${n}" ${!m.wounded[type]?'disabled':''}></label><div class="healing-quote"><p>Thức ăn <b data-healing-food>${cost.food}</b> · Gỗ <b data-healing-wood>${cost.wood}</b></p><p>Thời gian <b data-healing-duration>${cost.seconds}</b> giây</p></div><button class="gold-button" data-start-healing ${!m.wounded[type]||s.resources.food<cost.food||s.resources.wood<cost.wood?'disabled':''}>Bắt đầu cứu chữa</button><p>Nân const civicTypes=['shield','spear','bow','cavalry'];
const productionKinds=['farm','wood','stone'];
function initCivic(s){if(s.levels)s.levels.infirmary??=1;s.production??={nextId:1,jobs:{farm:null,wood:null,stone:null}};s.medical??={wounded:Object.fromEntries(civicTypes.map(k=>[k,0])),queue:null,healed:0,dead:0};return s;}
function populationCapacity(s){return 60+20*(s.levels?.hall||1);}
function occupiedCitizens(s){return Object.values(s.production?.jobs||{}).reduce((n,j)=>n+(j?.workers||0),0);}
function populationAvailable(s){return Math.max(0,populationCapacity(s)-occupiedCitizens(s));}
function woundedTotal(s){return Object.values(s.medical?.wounded||{}).reduce((n,v)=>n+v,0);}
function infirmaryCapacity(s){return Math.min(1000,20+20*(s.levels?.infirmary||1));}
function productionQuote(s,id,batches=1,emergency=false){if(!productionKinds.includes(id)||![1,5,10].includes(batches)||emergency&&id!=='farm')throw new Error('Công thức sản xuất không hợp lệ.');const level=s.levels[id],labor=technologyBonus(s,'production','labor'),foodSaving=technologyBonus(s,'production','foodSaving'),timeSaving=technologyBonus(s,'production','productionTime'),doubleChance=technologyBonus(s,'production','doubleHarvest'),bonus=vipBonuses(s).production+(skinBonus(s).production||0)+(petBonus(s).production||0);if(emergency)return{id,batches:1,workers:3,food:0,seconds:30,amount:50,resource:'food',chance:0,emergency:true};return{id,batches,workers:Math.max(1,Math.ceil((id==='stone'?16:12)*batches*(1-labor))),food:Math.ceil(({farm:5,wood:20,stone:25})[id]*batches*(1-foodSaving)),seconds:Math.max(4,Math.ceil((30+batches*5)/(1+level*.02)*(1-timeSaving))),amount:Math.floor((id==='stone'?80+12*level:120+18*level)*batches*(1+bonus)),resource:id==='farm'?'food':id,chance:Math.min(.5,doubleChance),emergency:false};}
function startProduction(state,id,batches=1,now=Date.now(),random=Math.random,emergency=false){const s=initCivic(structuredClone(state)),q=productionQuote(s,id,batches,emergency);if(s.production.jobs[id])throw new Error('Hãy nhận thành phẩm hoặc hủy mẻ đang có.');if(q.workers>populationAvailable(s))throw new Error('Chưa đủ dân rảnh. Nhận thành phẩm để dân trở về.');if(s.resources.food<q.food)throw new Error('Chưa đủ thức ăn. Có thể săn thú hoặc hái lượm cứu đói.');const roll=random();if(!Number.isFinite(roll)||roll<0||roll>=1)throw new Error('Kết quả sản xuất không hợp lệ.');s.resources.food-=q.food;s.production.jobs[id]={...q,id:s.production.nextId++,site:id,startedAt:now,endsAt:now+q.seconds*1000,double:roll<q.chance};return s;}
function claimProduction(state,id,now=Date.now()){const s=initCivic(structuredClone(state)),j=s.production.jobs[id];if(!j||now<j.endsAt)throw new Error('Chưa có thành phẩm để thu hoạch.');const amount=j.amount*(j.double?2:1);s.resources[j.resource]=Math.min(9999999,s.resources[j.resource]+amount);s.production.jobs[id]=null;return{state:s,amount,resource:j.resource,double:j.double};}
function cancelProduction(state,id){const s=initCivic(structuredClone(state));if(!s.production.jobs[id])throw new Error('Không có mẻ sản xuất.');s.production.jobs[id]=null;return s;}
function recordCasualties(state,type,loss){initCivic(state);if(!civicTypes.includes(type)||!Number.isInteger(loss)||loss<0)throw new Error('Tổn thất không hợp lệ.');const wounded=Math.min(Math.floor(loss*.75),Math.max(0,infirmaryCapacity(state)-woundedTotal(state))),dead=loss-wounded;state.medical.wounded[type]+=wounded;state.medical.dead=Math.min(1e9,state.medical.dead+dead);return{wounded,dead};}
function healingQuote(s,type,amount){if(!civicTypes.includes(type)||!Number.isInteger(amount)||amount<1||amount>1000)throw new Error('Số thương binh không hợp lệ.');return{type,amount,food:amount*8,wood:amount*4,seconds:Math.max(4,Math.ceil((15+amount*2)/(1+(s.levels.infirmary||1)*.05)))};}
function startHealing(state,type,amount,now=Date.now()){const s=initCivic(structuredClone(state)),q=healingQuote(s,type,amount);if(s.medical.queue)throw new Error('Linh Dược Viện đang cứu chữa một nhóm.');if(s.medical.wounded[type]<amount)throw new Error('Không đủ thương binh của binh chủng này.');if(s.resources.food<q.food||s.resources.wood<q.wood)throw new Error('Chưa đủ thức ăn và gỗ làm thuốc.');s.resources.food-=q.food;s.resources.wood-=q.wood;s.medical.queue={...q,endsAt:now+q.seconds*1000};return s;}
function finishHealing(s,now=Date.now()){initCivic(s);const q=s.medical.queue;if(q&&now>=q.endsAt){s.medical.wounded[q.type]-=q.amount;s.regiments[q.type]+=q.amount;s.troops+=q.amount;s.medical.healed=Math.min(1e9,s.medical.healed+q.amount);s.medical.queue=null;}return s;}
function validCivic(s){const plain=v=>v&&typeof v==='object'&&!Array.isArray(v),int=(v,min=0,max=9999999)=>Number.isInteger(v)&&v>=min&&v<=max,date=v=>Number.isFinite(v)&&v>=0&&v<=Date.now()+86400000;if(s.production!==undefined){const p=s.production;if(!plain(p)||!int(p.nextId,1,1e9)||!plain(p.jobs)||Object.keys(p.jobs).length!==3||!productionKinds.every(k=>Object.hasOwn(p.jobs,k)))return false;for(const[id,j]of Object.entries(p.jobs))if(j!==null&&(!plain(j)||j.site!==id||!int(j.id,1,p.nextId-1)||!int(j.workers,1,populationCapacity(s))||!int(j.amount,1)||!int(j.food)||!date(j.startedAt)||!date(j.endsAt)||j.endsAt<j.startedAt||j.resource!==(id==='farm'?'food':id)||typeof j.double!=='boolean'))return false;const ids=Object.values(p.jobs).filter(Boolean).map(j=>j.id);if(new Set(ids).size!==ids.length||occupiedCitizens(s)>populationCapacity(s))return false;}

function drawCityDecoration(ctx,index,x,y,width){const img=cachedImage('assets/city-life-pixel.png');if(!img.complete||!img.naturalWidth)return;const sw=img.naturalWidth/4,sh=img.naturalHeight/2,h=width*sh/sw;ctx.drawImage(img,index%4*sw,Math.floor(index/4)*sh,sw,sh,x-width/2,y-h+12,width,h);}

 for(let i=0;i<24;i++){const q=(time*.45+i*.071)%1,a=i*2.399+time*.6,dx=x+Math.cos(a)*r*(1-q*.4),dy=y-q*size*(complete?1.4:.8);ctx.globalAlpha=(1-q)*.75;ctx.fillStyle=i%3?'#ffdf8b':'#bafaf1';ctx.fillRect(dx,dy,3+i%3,7+i%5);}
 if(complete){ctx.globalAlpha=Math.max(0,.5-phase*.1);const g=ctx.createLinearGradient(x,y,x,y-size*1.5);g.addColorStop(0,'#ffd877');g.addColorStop(1,'#ffd87700');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-r,y+10);ctx.lineTo(x+r,y+10);ctx.lineTo(x+r*.4,y-size*1.4);ctx.lineTo(x-r*.4,y-size*1.4);ctx.fill();}ctx.restore();}

function validState(s) {
  const ids = new Set(heroes.map(h => h.id));
  return s?.version === 1 && Number.isSafeInteger(s.coins) && s.coins >= 0 && Number.isInteger(s.pity) && s.pity >= 0 && s.pity < 30 && Number.isSafeInteger(s.pulls) && s.pulls >= 0 && Number.isSafeInteger(s.wins) && s.wins >= 0 && Array.isArray(s.owned) && s.owned.length <= heroes.length && new Set(s.owned).size === s.owned.length && s.owned.every(id => ids.has(id)) && Array.isArray(s.team) && s.team.length <= 5 && new Set(s.team).size === s.team.length && s.team.every(id => s.owned.includes(id)) && s.overrides && typeof s.overrides === 'object' && !Array.isArray(s.overrides) && Object.entries(s.overrides).every(([id, o]) => ids.has(id) && o && typeof o === 'object' && !Array.isArray(o) && Object.keys(o).every(key => key === 'hp' || key === 'atk') && Number.isInteger(o.hp) && o.hp >= 50 && o.hp <= 300 && Number.isInteger(o.atk) && o.atk >= 10 && o.atk <= 80);
}

function summon(state, count = 1, random = Math.random) {
  if (![1, 10].includes(count) || state.coins < count * 100) throw new Error('Không đủ linh ngọc để chiêu mộ.');
  const next = structuredClone(state);
  const results = [];
  next.coins -= count * 100;
  for (let i = 0; i < count; i++) {
    const roll = random();
    const rarity = next.pity === 29 || roll < 0.05 ? 'SSR' : roll < 0.3 ? 'SR' : 'R';
    const pool = heroes.filter(h => h.rarity === rarity && !h.vipExclusive);
    const hero = pool[Math.min(pool.length - 1, Math.floor(random() * pool.length))];
    const duplicate = next.owned.includes(hero.id);
    if (duplicate) next.coins += 25;
    else next.owned.push(hero.id);
    next.pity = rarity === 'SSR' ? 0 : next.pity + 1;
    next.pulls++;
    results.push({ ...hero, duplicate });
  }
  return { state: next, results };
}

function multiplier(attacker, defender) {
  return { Hỏa:'Kim',Kim:'Mộc',Mộc:'Thổ',Thổ:'Thủy',Thủy:'Hỏa','Ánh sáng':'Bóng tối','Bóng tối':'Ánh sáng' }[attacker] === defender ? 1.35 : 1;
}

function createBattle(state) {
  if (state.team.length !== 5) throw new Error('Cần đủ 5 nhân vật để xuất trận.');
  const make = (id, side, index) => {
    const base = heroes.find(h => h.id === id);
    const h = { ...base, ...(side === 'ally' ? state.overrides[id] : {}) };
    return { ...h, key: `${side}-${index}`, side, maxHp: h.hp };
  };
  return { allies: state.team.map((id, i) => make(id, 'ally', i)), enemies: ['zhaoyun', 'nezha', 'bajie', 'erlang', 'diaochan'].map((id, i) => make(id, 'enemy', i)), turn: 1, active: 0, winner: null, log: ['Ải 01 · Hổ Lao Quan. Chọn mục tiêu để tấn công.'] };
}

function attack(battle, targetKey, skill = false) {
  if (battle.winner) return battle;
  const next = structuredClone(battle);
  const actor = next.allies[next.active];
  const target = next.enemies.find(h => h.key === targetKey && h.hp > 0);
  if (!actor || actor.hp <= 0 || !target) throw new Error('Mục tiêu không hợp lệ.');
  const hit = (a, t, boosted = false) => {
    const damage = Math.round(a.atk * multiplier(a.element, t.element) * (boosted ? 1.6 : 1));
    t.hp = Math.max(0, t.hp - damage);
    next.log.push(`${a.name}${boosted ? ' tung tuyệt kỹ' : ' tấn công'} → ${t.name}: −${damage} HP.`);
  };
  if (skill && next.turn % 3 !== 0) throw new Error('Tuyệt kỹ mở ở vòng 3, 6, 9…');
  hit(actor, target, skill);
  if (next.enemies.every(h => h.hp === 0)) { next.winner = 'ally'; return next; }
  const following = next.allies.findIndex((h, i) => i > next.active && h.hp > 0);
  if (following !== -1) { next.active = following; return next; }
  for (const enemy of next.enemies.filter(h => h.hp > 0)) {
    const victim = next.allies.find(h => h.hp > 0);
    if (!victim) break;
    hit(enemy, victim);
  }
  if (next.allies.every(h => h.hp === 0)) next.winner = 'enemy';
  else { next.turn++; next.active = next.allies.findIndex(h => h.hp > 0); }
  return next;
}

function initChronicle(s){s.chronicle??={onlineSeconds:0,claimedTime:[],claimedQuests:[],titles:[],equippedTitle:null,stats:{winStreak:0,lossStreak:0,bestWinStreak:0,bestLossStreak:0,losses:0,botWins:0,gathers:0,teleports:0,builds:0,trainings:0}};return s;}
function registerBattle(s,won,bot=false){initChronicle(s);const st=s.chronicle.stats;if(won){st.winStreak++;st.lossStreak=0;st.bestWinStreak=Math.max(st.bestWinStreak,st.winStreak);if(bot)st.botWins++;}else{st.lossStreak++;st.winStreak=0;st.losses++;st.bestLossStreak=Math.max(st.bestLossStreak,st.lossStreak);}return s;}
function questProgress(s,q){return q.metric==='campaign'?s.campaign?.cleared||0:q.metric==='wins'?s.wins:q.metric==='onlineSeconds'?s.chronicle?.onlineSeconds||0:s.chronicle?.stats[q.metric]||0;}
function timeGiftReward(minutes){if(!timeGiftMinutes.includes(minutes))throw new Error('Mốc thời gian không hợp lệ.');return{food:300+minutes*30,wood:300+minutes*30,stone:150+minutes*20};}
function chronicleGrant(s,reward){for(const k of ['food','wood','stone'])s.resources[k]=Math.min(9999999,s.resources[k]+reward[k]);}
function claimTimeGift(state,minutes){const s=initChronicle(structuredClone(state));if(!timeGiftMinutes.includes(minutes)||s.chronicle.onlineSeconds<minutes*60||s.chronicle.claimedTime.includes(minutes))throw new Error('Chưa đủ thời gian chơi hoặc đã nhận quà.');chronicleGrant(s,timeGiftReward(minutes));s.chronicle.claimedTime.push(minutes);return s;}
function claimQuest(state,id){const s=initChronicle(structuredClone(state)),q=questCatalog.find(q=>q.id===id);if(!q||questProgress(s,q)<q.target||s.chronicle.claimedQuests.includes(id))throw new Error('Chưa hoàn thành hoặc đã nhận thưởng.');chronicleGrant(s,{food:q.resource,wood:q.resource,stone:Math.round(q.resource*.7)});s.coins+=Math.round(q.resource*.05);if(q.title&&!s.chronicle.titles.includes(q.title))s.chronicle.titles.push(q.title);if(q.skin&&!s.account.cosmetics.includes(q.skin))s.account.cosmetics.push(q.skin);s.chronicle.claimedQuests.push(id);return s;}
function equipTitle(state,id){const s=initChronicle(structuredClone(state));if(id!==''&&!s.chronicle.titles.includes(id))throw new Error('Chưa sở hữu danh hiệu.');s.chronicle.equippedTitle=id||null;return s;}
function validChronicle(s){const c=s.chronicle;if(c===undefined)return true;const obj=v=>v&&typeof v==='object'&&!Array.isArray(v),integer=n=>Number.isInteger(n)&&n>=0&&n<=1000000000;if(!obj(c)||!Number.isFinite(c.onlineSeconds)||c.onlineSeconds<0||c.onlineSeconds>1000000000||!obj(c.stats)||!['winStreak','lossStreak','bestWinStreak','bestLossStreak','losses','botWins','gathers','teleports','builds','trainings'].every(k=>integer(c.stats[k])))return false;for(const [key,test]of [['claimedTime',n=>timeGiftMinutes.includes(n)&&c.onlineSeconds>=n*60],['claimedQuests',id=>questCatalog.some(q=>q.id===id&&questProgress(s,q)>=q.target)],['titles',id=>Object.hasOwn(titleCatalog,id)]])if(!Array.isArray(c[key])||new Set(c[key]).size!==c[key].length||!c[key].every(test))return false;return c.equippedTitle===null||c.titles.includes(c.equippedTitle);}

function initInheritance(s){s.inheritance??={fragments:[],discovered:[],cleared:[],manuals:[],equipped:{},activeRealm:null};return s;}

function equipInheritance(state,heroId,manualId){const s=initInheritance(structuredClone(state));if(!s.owned.includes(heroId))throw new Error('Chưa sở hữu tướng.');if(s.march||s.worldAI?.expedition||s.battle&&!s.battle.winner)throw new Error('Chờ đội trở về và hoàn tất trận.');if(!manualId){delete s.inheritance.equipped[heroId];return s;}if(!s.inheritance.manuals.includes(manualId))throw new Error('Chưa học bí kíp. Nhận chiến lợi qua hộp thư sau khi thắng BOSS.');s.inheritance.equipped[heroId]=manualId;return s;}
function validInheritance(s){const v=s.inheritance;if(v===undefined)return true;if(!v||typeof v!=='object'||Array.isArray(v))return false;for(const key of ['fragments','discovered','cleared'])if(!Array.isArray(v[key])||new Set(v[key]).size!==v[key].length||!v[key].every(id=>secretRealms.some(r=>r.id===id)))return false;if(!v.discovered.every(id=>v.fragments.includes(id))||!v.cleared.every(id=>v.discovered.includes(id)))return false;if(!Array.isArray(v.manuals)||new Set(v.manuals).size!==v.manuals.length||!v.manuals.every(id=>inheritanceManuals.some(m=>m.id===id)&&(marketManualIds.includes(id)?s.auction?.learned?.includes(id):secretRealms.some(r=>r.manualId===id&&v.cleared.includes(r.id)))))return false;if(!v.equipped||typeof v.equipped!=='object'||Array.isArray(v.equipped)||!Object.entries(v.equipped).every(([id,m])=>s.owned.includes(id)&&v.manuals.includes(m)))return false;return v.activeRealm===null||v.discovered.includes(v.activeRealm);}

function runePointsForMilestone(level){return Math.floor(level/5)+2;}
function initRunes(s){if(!s.runes){const earned=(s.account?.claimedLevel||[]).reduce((sum,l)=>sum+runePointsForMilestone(l),0);s.runes={earned,points:earned,ranks:{}};}return s;}
function runeUpgradeCost(node,rank){return node.baseCost+Math.floor(rank/3);}
function runeSpent(ranks){let sum=0;for(const [id,rank]of Object.entries(ranks)){const node=runeCatalog.find(n=>n.id===id);if(!node)return NaN;for(let i=0;i<rank;i++)sum+=runeUpgradeCost(node,i);}return sum;}
function runeBonuses(s){const result={};for(const node of runeCatalog){const rank=s.runes?.ranks[node.id]||0;if(rank>0)result[node.stat]=(result[node.stat]||0)+node.perRank*rank;}return result;}
function awardRunePoints(s,level){initRunes(s);const n=runePointsForMilestone(level);s.runes.earned+=n;s.runes.points+=n;return s;}

const scenePositions=new Map();
function mountViewportScenes(main,key){
 applyEnglishUI(main);
 if(main.querySelector(':scope > .fixed-screen'))return;
 const tabs=main.querySelector(':scope > .account-tabs'),fixed=main.querySelector(':scope > .doll-hall'),host=fixed?.querySelector('.doll-tab-content')||main;
 const roots=[...host.children].filter(n=>n!==tabs&&!n.matches('.gear-curtain'));
 if(!roots.length)return;
 const tray=document.createElement('div');tray.className='viewport-tray';const bar=document.createElement('nav');bar.className='scene-controls';bar.setAttribute('aria-label','Content Pagination');
 roots.forEach(n=>n.remove());host.append(tray,bar);
 const pages=[];let current;
 function newPage(){current=document.createElement('section');current.className='viewport-scene';tray.append(current);pages.push(current);}
 const collections='.heroes-grid,.bag-grid,.level-rewards,.character-skill-list,.skin-gallery,.time-gifts,.rune-grid,.pets-grid,.bonds-grid';
 function place(node){
  if(node.matches(collections)){[...node.children].forEach(place);return;}
  if(!current)newPage();current.append(node);
  if(current.scrollHeight<=tray.clientHeight+2)return;
  if(current.children.length>1){node.remove();newPage();current.append(node);}
  if(current.scrollHeight>tray.clientHeight+2&&node.children.length>1&&!node.matches('article,form,dl,button,select')){node.remove();[...node.children].forEach(place);}
 }
 roots.forEach(place);
 for(let i=pages.length-1;i>=0;i--)if(!pages[i].children.length){pages[i].remove();pages.splice(i,1);}
 if(!pages.length){bar.remove();return;}
 let index=Math.min(scenePositions.get(key)||0,pages.length-1);
 function show(){pages.forEach((p,i)=>p.hidden=i!==index);bar.innerHTML=`<button data-scene-prev ${index===0?'disabled':''}>← Previous</button><span>${index+1} / ${pages.length}</span><button data-scene-next ${index===pages.length-1?'disabled':''}>Next →</button>`;scenePositions.set(key,index);}
 bar.onclick=e=>{if(e.target.closest('[data-scene-prev]')&&index>0)index--;else if(e.target.closest('[data-scene-next]')&&index<pages.length-1)index++;else return;show();};show();
}

function equipmentPicture(template){const slots=['helmet','armor','weapon','jewelry','relic'],path=equipmentAffinity(template),index=Math.max(0,slots.indexOf(template.slot));const tier=Math.max(0,['D','C','B','A','S','SS','SSS','SSR'].indexOf(template.grade)),name=template.name||'',weapon=template.slot==='weapon'?(name.includes('Bổng')?0:name.includes('Thương')||name.includes('Kích')?1:name.includes('Cung')?2:name.includes('Trượng')?3:name.includes('Đao')?5:name.includes('Quạt')||name.includes('Phiến')?6:name.includes('Chùy')||name.includes('Chù')?7:4):null;return `<span class="equipment-picture rarity-picture rarity-${template.grade} ${weapon!==null?'rarity-weapon':''} affinity-${path} ${weapon!==null?'weapon-picture':''}" style="--rarity-x:${index*25}%;--rarity-y:${tier*100/7}%;--weapon-rarity-x:${(weapon||0)*100/7}%;--gear-x:${index*25}%;--gear-y:${path==='dark'?100:0}%;${weapon!==null?'--weapon-x:'+weapon%4*100/3+'%;--weapon-y:'+Math.floor(weapon/4)*100+'%;':''}" role="img" aria-label="${template.name}"><i class="affinity-mark" title="${path==='dark'?'Bóng tối':'Ánh sáng'}">${path==='dark'?'☾':'☀'}</i></span>`;}

function fitGameResolution(){
 const root=document.documentElement,vv=window.visualViewport,css=getComputedStyle(root),left=parseFloat(css.getPropertyValue('--safe-left'))||0,right=parseFloat(css.getPropertyValue('--safe-right'))||0,top=parseFloat(css.getPropertyValue('--safe-top'))||0,bottom=parseFloat(css.getPropertyValue('--safe-bottom'))||0,w=Math.max(1,(vv?.width||innerWidth)-left-right),h=Math.max(1,(vv?.height||innerHeight)-top-bottom),mobile=matchMedia('(pointer:coarse)').matches,rotated=mobile&&h>w,screenWidth=rotated?h:w,screenHeight=rotated?w:h,width=mobile?1280:1920,height=mobile?width*screenHeight/screenWidth:1080,scale=Math.min(screenWidth/width,screenHeight/height);
 root.classList.toggle('touch-game',mobile);root.classList.toggle('rotated-game',rotated);root.style.setProperty('--game-width',width+'px');root.style.setProperty('--game-height',height+'px');root.style.setProperty('--game-scale',scale);root.style.setProperty('--game-left',(rotated?left+w:left+Math.max(0,(w-width*scale)/2))+'px');root.style.setProperty('--game-top',(top+Math.max(0,(screenHeight-height*scale)/2))+'px');
}

// Native scrolling can use the wrong axis inside Safari's rotated game frame.
function bindHeroCarouselGestures(carousel){
 if(!matchMedia('(pointer:coarse)').matches)return;
 let drag=null,swiped=false;
 carousel.style.touchAction='none';
 carousel.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,top:carousel.scrollTop};swiped=false;});
 carousel.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const scale=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--game-scale'))||1,delta=document.documentElement.classList.contains('rotated-game')?-(e.clientX-drag.x)/scale:(e.clientY-drag.y)/scale;if(!swiped&&Math.abs(delta)<6)return;if(!swiped){swiped=true;carousel.setPointerCapture(e.pointerId);}e.preventDefault();carousel.scrollTop=drag.top-delta;},{passive:false});
 carousel.addEventListener('pointerup',()=>{drag=null;});
 carousel.addEventListener('pointercancel',()=>{drag=null;swiped=false;});
 carousel.addEventListener('click',e=>{if(swiped){e.preventDefault();e.stopImmediatePropagation();swiped=false;}},true);
}

 if(tab==='gear')return head+`<p class="inventory-note">Mỗi món là một vật phẩm độc lập, kể cả món trùng. Cường hóa +1–+10 tại màn Nhân vật; SSR đủ 5 ô kích hoạt bộ ×3 và THẦN.</p><div class="inventory-pagination"><button data-bag-page="${p-1}" ${p===0?'disabled':''}>← Trước</button><span>Trang ${p+1}/${gearPages} · Tổng ${s.inventory.length} món · Không giới hạn ô</span><button data-bag-page="${p+1}" ${p>=gearPages-1?'disabled':''}>Sau →</button></div><div class="bag-grid">${s.inventory.slice(p*48,p*48+48).map(i=>{const t=itemById[i.templateId],owner=equipmentOwner(s,i.id);return `<article class="inventory-item gear-item grade-${t.grade}" data-grade="${t.grade}"><span class="item-glyph">${invItemGlyph(t)}</span><span class="grade-label grade-${t.grade}">${t.grade} +${i.level} · ×1</span><h3>${t.name}</h3><p>${inventoryBonusText(t,i.level)}</p><small>${owner?'Đang đeo: '+characterById[owner].name:t.heroId?'Dành riêng: '+characterById[t.heroId].name:'Chưa trang bị'} · ${i.id}</small><p>Dùng tại ô ${({helmet:'mũ',armor:'giáp',weapon:'vũ khí',jewelry:'trang sức',relic:'cổ vật'})[t.slot]} để tăng chỉ số nhân vật.</p><button class="outline-button" data-inspect="${owner||t.heroId||s.team[0]||s.owned[0]}">Quản lý trang bị</button><button class="text-button" data-salvage="${i.id}" ${owner||s.march?'disabled':''}>Phân giải → ${i.level*10} tinh hoa</button></article>`;}).join('')}</div>`;
 if(tab==='shards')return head+`<div class="shard-summary">◈ Mảnh SSR vạn năng: <b>${a.bag.ssrUniversal}</b> · Chỉ dùng cho SSR. Mảnh riêng dùng đúng nhân vật; 20, 40, 60, 80, 100, 120, 140 mảnh cho lần lượt 7 sao. Mỗi sao +8% HP, hai công và hai kháng.</div><div class="bag-grid">${characterRoster.filter(h=>s.owned.includes(h.id)||(a.shards[h.id]||0)>0).map(h=>{const star=a.stars[h.id]||0,cost=20*(star+1),own=s.owned.includes(h.id),count=a.shards[h.id]||0;return `<article class="inventory-item shard-item grade-${h.grade}">${portrait(h.id)}<h3>${h.name}</h3><span class="star-rating">${'★'.repeat(star)}${'☆'.repeat(7-star)}</span><p>Mảnh riêng: <b>${count}</b>${h.vipExclusive?' · Độc quyền VIP':''}</p><p>Dùng để nâng sao ${h.name}; không tiêu hao nhân vật.</p><button class="gold-button" data-star-hero="${h.id}" ${!own||star>=7||count+(h.grade==='SSR'?a.bag.ssrUniversal:0)<cost||s.march?'disabled':''}>${!own?'Chưa sở hữu':star===7?'Đã đạt 7 sao':'Tăng sao · '+cost+' mảnh'}</button><button class="outline-button" data-inspect="${h.id}">Xem nhân vật</button></article>`;}).join('')}</div>`;
 if(tab==='pets')return head+`<div class="shard-summary">Điểm gacha linh thú: <b>${a.bag.petGachaPoint}</b> · Chỉ có trong quà VIP. Linh quả: <b>${a.bag.petFood}</b> để tăng cấp thú (tối đa 20). Mảnh linh thú riêng dùng để tăng sao (tối đa 5); sao 5 thức tỉnh hình ảnh và kỹ năng.</div><div class="bag-grid">${petCatalog.map(p=>{const owned=Boolean(a.pets[p.id]),star=a.petStars[p.id]||0;return `<article class="inventory-item">${petArt(p,star===5)}<h3>${p.name} · ${owned?'×1':'×0'}</h3><span class="star-rating">${'★'.repeat(star)}${'☆'.repeat(5-star)}</span><p>Mảnh riêng: <b>${a.petShards[p.id]||0}</b> · ${owned?'Cấp '+a.pets[p.id]+'/20':'Chưa sở hữu'}</p><p>${p.text}. Thức tỉnh 5 sao: ${petAwakenings[p.id].text}</p><button class="outline-button" data-view="pets">Gacha & chăm sóc</button></article>`;}).join('')}</div>`;
 return head+`<div class="bag-grid">${cosmeticCatalog.map(c=>{const owned=a.cosmetics.includes(c.id);return `<article class="inventory-item cosmetic-inventory ${c.className}"><span class="item-glyph">${c.type==='frame'?'♛':c.type==='city'?'♜':'▤'}</span>${c.type==='city'?castleSkinArt(c.id):''}<b>×${owned?1:0}</b><h3>${c.name}</h3><p>${({frame:'Khung chân dung người chơi trên hồ sơ và HUD.',chat:'Khung lời nhắn trong sổ tay offline của quân vương.',city:'Đổi hình thành và kích hoạt hiệu ứng của đúng skin đang trang bị.'})[c.type]}</p>${c.type==='city'?`<p>${skinEffectText(castleSkins.find(k=>k.id===c.id))}</p><small>${castleSkins.find(k=>k.id===c.id).source}</small>`:'<small>Nguồn: quà tăng cấp hoặc quà VIP.</small>'}<button class="outline-button" data-cosmetic="${c.id}" ${!owned?'disabled':''}>${a.equipped[c.type]===c.id?'✓ Đang dùng':owned?'Trang bị':'Chưa sở hữu'}</button></article>`;}).join('')}</div><section class="paper-panel"><h2>Danh hiệu đang sở hữu</h2>${s.chronicle.titles.length?s.chronicle.titles.map(id=>`<p>${titleCatalog[id]} · ×1</p>`).join(''):'<p>Chưa có danh hiệu. Hoàn thành nhiệm vụ để mở.</p>'}<button class="outline-button" data-view="quests">Bảng nhiệm vụ và danh hiệu</button></section>`;
}

const aFmt=n=>Math.floor(n).toLocaleString('en-US');
const escapeAccountText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function accountTabs(view){return `<nav class="account-tabs" aria-label="Người chơi và phát triển">${[['profile','Người chơi'],['pets','Thú cưng'],['army','Kĩ thuật'],['skins','Skin thành'],['runes','Bảng ngọc']].map(([id,name])=>`<button data-view="${id}" class="${view===id?'selected':''}">${navArt(id)} <span>${name}</span></button>`).join('')}</nav>`;}
function accountPetArt(pet,awakened=false){return `<span class="celestial-art pet-art ${awakened?'awakened':''}" style="background-position:${(pet.artIndex%5)*25}% ${awakened?0:100}%;background-size:500% ${awakened?100:200}%" role="img" aria-label="${pet.name}${awakened?' thức tỉnh 5 sao':''}"></span>`;}
function accountRewardContent(reward,portrait){return `<div class="reward-chips"><span>◈ ${aFmt(reward.coins)} ngọc</span><span>♧ ${aFmt(reward.resources)} mỗi tài nguyên</span><span>✧ ${aFmt(reward.essence)} tinh hoa</span>${Object.entries(reward.bag).map(([id,n])=>`<span>${bagCatalog[id].icon} ${n} ${bagCatalog[id].name}</span>`).join('')}${reward.dragon?`<span>${elementalDragonArt(reward.dragon)} Long linh độc quyền · ${reward.dragon}</span>`:''}${reward.runePoints?`<span>◈ ${reward.runePoints} điểm bảng ngọc</span>`:''}${reward.shards?`<span class="grade-label grade-SSR">${reward.shards} mảnh SSR riêng</span>`:''}${reward.ssr?'<span class="grade-label grade-SSR">Chắc chắn 1 SSR thường ngẫu nhiên; trùng → 40 mảnh</span>':''}${reward.gear?`<span class="grade-label grade-SSR">${itemById[reward.gear].name} +${reward.gearLevel||1}</span>`:''}${reward.pet?`<span>♧ Mở ${petCatalog.find(p=>p.id===reward.pet).name}</span>`:''}${reward.cosmetics.map(id=>`<span>✥ ${cosmeticCatalog.find(c=>c.id===id).name}</span>`).join('')}</div>${reward.hero?`<div class="exclusive-reward">${portrait(reward.hero)}<div><b>SSR THÁI SƠ ĐỘC QUYỀN</b><h3>${characterById[reward.hero].name}</h3><p>Kèm ${characterById[reward.hero].weapon}. Đã sở hữu → 40 mảnh riêng.</p></div></div>`:''}`;}
function profilePage(s,portrait){
 const a=s.account,p=playerProgress(s),v=vipLevel(s),pending=Array.from({length:20},(_,i)=>(i+1)*5).filter(n=>n<=p.level&&!a.claimedLevel.includes(n)).length;
 const power=s.team.reduce((sum,id)=>{const st=getCharacterStats(s,id);return sum+st.maxHp+st.physicalAtk*5+st.magicAtk*5+st.armor*3+st.resist*3;},0);
 return `<section class="profile-shell"><div class="profile-heading"><div><span class="eyebrow">HỒ SƠ LÃNH CHÚA · OFFLINE</span><h1>Thông tin quân vương</h1></div><button class="vip-emblem" data-view="vip">♔ VIP ${v}</button></div><div class="lord-profile"><div class="lord-banner"><div class="avatar-frame ${a.equipped.frame} ${titleFrameClass(s)}">${portrait(a.avatar)}</div>${s.titles?.equippedTitleId?`<span class="lord-title">${titleById[s.titles.equippedTitleId].name}</span>`:''}<b>${escapeAccountText(a.name)}</b>${s.chronicle.equippedTitle?`<span class="lord-title">${titleCatalog[s.chronicle.equippedTitle]}</span>`:''}<span class="level-medal">${p.level}</span><small>QUÂN VƯƠNG THANH VÂN</small></div><div class="lord-info"><small>ID: TM-OFFLINE · Bản lưu trên máy này</small><h2>${escapeAccountText(a.name)}</h2><div class="lord-xp"><b>Cấp ${p.level}/100</b><progress max="${p.required||1}" value="${p.level===100?1:p.xp}"></progress><span>${p.level===100?'Cấp tối đa':aFmt(p.xp)+' / '+aFmt(p.required)+' EXP'}</span></div><form id="profile-form"><label>Tên người chơi<input name="lordName" value="${escapeAccountText(a.name)}" maxlength="24" required></label><label>Chân dung<select name="avatar">${s.owned.map(id=>`<option value="${id}" ${a.avatar===id?'selected':''}>${characterById[id].name}</option>`).join('')}</select></label><button class="outline-button">Lưu hồ sơ</button></form><div class="lord-meta"><p>⌖ Vương quốc <b>${realmFactions[a.realm.faction]?.name||'Chưa chọn'} · ${realmCities.find(c=>c.id===a.realm.city)?.name||'Thanh Vân'}</b></p><p>♜ Lãnh địa <b>Thiên Mệnh Thành · Đại điện ${s.levels.hall}</b></p><p>⚑ Chiến tích <b>${s.wins} chiến thắng · ${s.cleared.length}/3 trại</b></p></div></div><div class="lord-power"><div><span>⚔ Chiến lực đội hình</span><b>${aFmt(power)}</b></div><div><span>⚑ Quân lực dự bị</span><b>${aFmt(s.troops)} quân</b></div><div><span>♔ Điểm VIP</span><b>${aFmt(a.vipPoints)}</b><button data-view="vip">Đặc quyền VIP ${v} →</button></div><div><span>♧ Linh thú đồng hành</span><b>${(petCatalog.find(p=>p.id===a.activePet)?.name||'Chưa có linh thú')}</b><button data-view="pets">Chăm sóc →</button></div></div></div><div class="profile-actions"><button data-view="titles">Titles & Frames</button><a href="#level-gifts">✦ Quà tăng cấp ${pending?'('+pending+')':''}</a><a href="#cosmetics">✥ Ngoại trang</a><button data-view="bag">▣ Túi đồ</button><button data-view="help">? Hướng dẫn</button><button data-view="saves">Save Management</button></div></section><section class="paper-panel progression-explainer"><h2>Con đường quân vương</h2><p>EXP từ thắng trại (120 × cấp trại), thu thập (70), hoàn tất huấn luyện (30), hoàn tất xây dựng (100 × cấp mới). Mỗi cấp mới nhận 100 + 10 × cấp điểm VIP. Không mua VIP bằng tiền thật.</p></section><section id="level-gifts"><div class="section-heading"><div><span class="eyebrow">20 MỐC · CẤP 5 → 100</span><h2>Quà tăng cấp</h2></div><small>Từ cấp 50: vé, thần trang và ngoại trang. Từ cấp 60: mỗi mốc chắc chắn SSR thường.</small></div><div class="level-rewards">${Array.from({length:20},(_,i)=>(i+1)*5).map(level=>{const done=a.claimedLevel.includes(level),ready=p.level>=level&&!done;return `<article class="level-reward ${ready?'claimable':''} ${done?'claimed':''}"><div class="gift-level">${level}<small>CẤP</small></div><div><h3>Hộp quà quân vương ${level}</h3>${accountRewardContent(milestoneReward(level),portrait)}</div><button class="${ready?'gold-button':'outline-button'}" data-claim-level="${level}" ${!ready?'disabled':''}>${done?'✓ Đã nhận':ready?'Nhận quà':'Cấp '+level}</button></article>`;}).join('')}</div></section>${cosmeticsSection(s,portrait)}`;
}
function cosmeticsSection(s,portrait){const a=s.account;return `<section id="cosmetics" class="paper-panel cosmetics-workshop"><h2>Khung, thành phố và khung chat</h2><p>Ngoại trang nhận từ quà cấp 50+ và VIP. Khung chat dùng ở sổ tay offline dưới đây.</p><div class="cosmetic-preview"><div class="avatar-frame ${a.equipped.frame} ${titleFrameClass(s)}">${portrait(a.avatar)}</div>${s.titles?.equippedTitleId?`<span class="lord-title">${titleById[s.titles.equippedTitleId].name}</span>`:''}<div class="chat-bubble ${a.equipped.chat}"><b>${escapeAccountText(a.name)}</b><p>Thiên mệnh nằm trong tay ta!</p></div><div class="city-skin-preview ${a.equipped.city}">${castleSkinArt(a.equipped.city)}<small>${cosmeticCatalog.find(c=>c.id===a.equipped.city).name}</small></div></div><div class="cosmetics-grid">${['frame','chat','city'].map(type=>`<div><h3>${({frame:'Khung người chơi',chat:'Khung chat',city:'Skin thành phố'})[type]}</h3>${cosmeticCatalog.filter(c=>c.type===type).map(c=>`<button class="cosmetic-choice ${a.equipped[type]===c.id?'chosen':''} ${c.className}" data-cosmetic="${c.id}" ${!a.cosmetics.includes(c.id)?'disabled':''}>${c.name} ${a.equipped[type]===c.id?'✓':a.cosmetics.includes(c.id)?'· Trang bị':'· Chưa mở'}</button>`).join('')}</div>`).join('')}</div><div class="local-chat"><h3>Sổ tay quân vương · Lưu trên máy</h3>${a.messages.map(m=>`<p class="chat-bubble ${m.frame}">${escapeAccountText(m.text)}</p>`).join('')}<form id="local-chat-form"><input name="message" maxlength="180" placeholder="Viết lời nhắn trong bản lưu của bạn…" required><button class="outline-button">Lưu lời nhắn</button></form></div></section>`;}
function vipPage(s,portrait,preview=null){const current=vipLevel(s),level=preview??Math.min(15,Math.max(1,current)),bonus=vipBonuses(s,level),reward=vipReward(level),done=s.account.claimedVip.includes(level),ready=current>=level&&!done,next=vipThresholds[Math.min(15,current+1)];return `<section class="vip-palace"><div class="vip-top"><div class="vip-crest">♔<b>${current}</b><small>VIP</small></div><div><span class="eyebrow">THIÊN MỆNH · ĐẶC QUYỀN QUÂN VƯƠNG</span><h1>Vinh quang chí tôn</h1><p>${aFmt(s.account.vipPoints)} / ${aFmt(next)} điểm · ${current===15?'VIP tối đa':`Còn ${aFmt(next-s.account.vipPoints)} điểm đến VIP ${current+1}`}</p><progress value="${s.account.vipPoints}" max="${next||1}"></progress><small>Tăng cấp người chơi để nhận điểm VIP. Toàn bộ quà và đặc quyền đều miễn phí trong bản offline.</small></div></div><div class="vip-level-picker">${Array.from({length:15},(_,i)=>i+1).map(n=>`<button class="${n===level?'selected':''} ${current>=n?'unlocked':''}" data-vip-preview="${n}">VIP ${n}${s.account.claimedVip.includes(n)?' ✓':''}</button>`).join('')}</div><div class="vip-columns"><section class="vip-privileges"><span class="eyebrow">CỘNG DỒN · ÁP DỤNG TỰ ĐỘNG</span><h2>Đặc quyền VIP ${level}</h2>${[['march','♞','Tốc độ hành quân'],['gather','♧','Tốc độ thu thập ngoài thành'],['construction','⚒','Tốc độ xây dựng'],['training','⚑','Tốc độ huấn luyện'],['production','▣','Sản xuất trong thành'],['defense','▰','Giáp và kháng phép toàn đội']].map(([key,icon,name])=>`<div class="privilege-row"><span>${icon} ${name}</span><b>+${(bonus[key]*100).toFixed(1).replace(/\.0$/,'')}%</b></div>`).join('')}<div class="privilege-row"><span>⌛ Giảm chờ xây dựng</span><b>−${bonus.freeBuildSeconds.toFixed(1)}s</b></div><p>Thời gian = thời gian gốc ÷ (1 + tốc độ). Giảm chờ áp dụng sau tăng tốc, tối thiểu 0,5s. Hàng đợi và hành quân đã bắt đầu giữ thời gian đã chốt.</p><div class="vip-current">${current===level?'ĐANG KÍCH HOẠT':current>level?'ĐÃ BAO GỒM Ở VIP HIỆN TẠI':'XEM TRƯỚC · CHƯA KÍCH HOẠT'}</div></section><section class="vip-gift"><div class="pixel-chest">♛</div><h2>Bảo rương VIP ${level}</h2>${accountRewardContent(reward,portrait)}<button class="gold-button full" data-claim-vip="${level}" ${!ready?'disabled':''}>${done?'✓ Đã nhận bảo rương':ready?'Mở bảo rương VIP '+level:'Cần '+aFmt(vipThresholds[level])+' điểm VIP'}</button><small>Nhận một lần mỗi cấp VIP; quà không cần thanh toán.</small></section></div></section><section class="exclusive-gallery"><span class="eyebrow">SIÊU THẦN THÁI SƠ · 5 SSR ĐỘC QUYỀN</span><h2>Những vị thần trước thời huyền thoại</h2><p>Không có trong gacha thường, quà cấp độ hoặc nút mở tướng sandbox. Chỉ có trong bảo rương VIP 3, 6, 9, 12, 15.</p><div>${vipExclusiveIds.map((id,i)=>`<article class="exclusive-card grade-SSR">${portrait(id)}<span class="grade-label grade-SSR">SSR · THÁI SƠ</span><h3>${characterById[id].name}</h3><p>${characterById[id].skill.name}</p><b>VIP ${(i+1)*3}</b><button class="outline-button" data-inspect="${id}">${s.owned.includes(id)?'Đã sở hữu · Chi tiết':'Xem kỹ năng'}</button></article>`).join('')}</div></section>`;}
function petsPage(s,results=[]){const a=s.account;return `<section class="page-title"><div><span class="eyebrow">LINH THÚ CÁC · GACHA RIÊNG</span><h1>Triệu hồi linh thú.</h1><p>Điểm gacha chỉ nhận trong quà VIP. Mỗi thú có tỷ lệ 20%; trùng thú cho 20 mảnh riêng. Tối đa 5 sao, cấp 20.</p></div><button class="outline-button" data-view="vip">♔ Nhận điểm từ VIP</button></section><section class="pet-gacha-panel"><div><span class="eyebrow">NGHI THỨC TRIỆU HỒI</span><h2>♧ ${a.bag.petGachaPoint} điểm linh thú</h2><p>1 điểm = 1 lượt; không dùng linh ngọc, không đổi từ vật phẩm khác.</p></div><button class="gold-button" data-draw-pet="1" ${a.bag.petGachaPoint<1?'disabled':''}>Gacha ×1</button><button class="outline-button" data-draw-pet="10" ${a.bag.petGachaPoint<10?'disabled':''}>Gacha ×10</button></section>${results.length?`<div class="pet-draw-results">${results.map(p=>`<div>${accountPetArt(p)}<b>${p.name}</b><small>${p.duplicate?'+20 mảnh riêng':'Linh thú mới · 1 sao'}</small></div>`).join('')}</div>`:''}<p class="inventory-note">Linh quả: ${a.bag.petFood} · Thú cấp 5 sao đổi hình ảnh và mở kỹ năng thức tỉnh. Chọn một thú đồng hành để kích hoạt buff; linh long vẫn hoạt động riêng.</p><div class="pets-grid">${petCatalog.map(p=>{const level=a.pets[p.id]||0,star=a.petStars[p.id]||0,active=a.activePet===p.id,awakened=star===5;return `<article class="pet-card ${active?'active':''} ${!level?'locked':''} ${awakened?'pet-awakened':''}">${accountPetArt(p,awakened)}<span class="eyebrow">${awakened?'THỨC TỈNH · ':''}${p.title}</span><h2>${p.name}</h2><span class="star-rating">${'★'.repeat(star)}${'☆'.repeat(5-star)}</span><b>${level?'Cấp '+level+'/20':'Nhận từ gacha linh thú'}</b><p>${p.text}: <strong>+${(p.rate*(level||1)*(1+.15*Math.max(0,star-1))*100).toFixed(1)}%</strong></p><div class="pet-awakening"><b>${petAwakenings[p.id].name}</b><p>${petAwakenings[p.id].text}</p><small>${awakened?'✓ Đã thức tỉnh':'Mở ở 5 sao'}</small></div><button class="${active?'outline-button':'gold-button'} full" data-active-pet="${p.id}" ${!level||active||s.march?'disabled':''}>${active?'✓ Đang đồng hành':level?'Chọn đồng hành':'Chưa sở hữu'}</button><button class="outline-button full" data-level-pet="${p.id}" ${!level||level>=20||a.bag.petFood<level*5||s.march?'disabled':''}>Nâng cấp · ${5*(level||1)} linh quả</button><small>Mảnh ${p.name}: ${a.petShards[p.id]||0}</small><button class="gold-button full" data-star-pet="${p.id}" ${!level||star>=5||(a.petShards[p.id]||0)<star*20||s.march?'disabled':''}>${awakened?'✓ Đã đạt 5 sao':'Tăng sao · '+20*(star||1)+' mảnh'}</button></article>`;}).join('')}</div>`;}
function bagPage(s,portrait,tab='resources',page=0){return renderInventory(s,portrait,tab,page,accountPetArt);}

const characterArtSources={'battle-units-pixel.png':'assets/battle-units-pixel.png','roster-a-pixel.png':'assets/roster-a-pixel.png','roster-b-pixel.png':'assets/roster-b-pixel.png','celestial-pets-pixel.png':'assets/celestial-pets-pixel.png'};
function characterStageArt(h){const i=h.artIndex,asset=i<8?'battle-units-pixel.png':i<32?'roster-a-pixel.png':i<56?'roster-b-pixel.png':'celestial-pets-pixel.png',n=i<8?i:i<56?(i-8)%24:i-56,cols=i<8?4:i<56?6:5,rows=i<8?2:i<56?4:2;return `<span class="character-splash-art" style="background-image:url('${characterArtSources[asset]}');background-size:${cols*100}% ${rows*100}%;background-position:${n%cols*100/(cols-1)}% ${Math.floor(n/cols)*100/(rows-1)}%" role="img" aria-label="${h.name}"></span>`;}
const charNumber=n=>Math.floor(n).toLocaleString('en-US');
function charBonusText(template,level=1){return Object.entries(template.bonuses).map(([k,v])=>`${statNames[k]||rareStatNames[k]||k} ${typeof v==='boolean'?'✓':v<1?'+'+(v*(1+(level-1)*.12)*100).toFixed(1)+'%':'+'+Math.round(v*(1+(level-1)*.12))}`).join(' · ');}
function skillIcon(skill){return `<span class="skill-icon" style="--ix:${skill.iconIndex%4*100/3}%;--iy:${Math.floor(skill.iconIndex/4)*100/3}%" role="img" aria-label="${skill.name}"></span>`;}
function characterSkillList(s,h){return `<section class="character-skill-list">${h.skills.map((ability,index)=>{const rank=getSkillRank(s,h.id,index),owned=s.owned.includes(h.id);return `<article class="character-skill-entry" id="ability-${index}"><div class="character-skill-heading"><button class="skill-description-button" data-description="skill:${h.id}:${index}">${skillIcon(ability)}</button><div><h3>${index+1}. ${ability.name}</h3><small>Chủ động · Cấp ${rank}/5 · ${Math.round(ability.cost*100)} ${h.resource==='mana'?'mana':'nộ'} · Hồi ${ability.cooldown}s</small></div></div><p class="skill-inspect-hint">Bấm biểu tượng để xem toàn bộ kỹ năng.</p><button class="outline-button full" data-skill-hero="${h.id}" data-skill-index="${index}" ${!owned||s.march||rank>=5||s.essence<rank*20||s.coins<rank*50?'disabled':''}>Nâng chiêu ${index+1} · ${rank*20} tinh hoa + ${rank*50} ngọc</button></article>`;}).join('')}${h.passiveSkill?`<article class="character-skill-entry passive-skill" id="passive-ability"><div class="character-skill-heading"><button data-description="skill:${h.id}:passive">${skillIcon(h.passiveSkill)}</button><div><h3>5. ${h.passiveSkill.name}</h3><small>Bị động · SSR Thái Sơ độc quyền VIP</small></div></div><p>Bấm biểu tượng để xem nội tại.</p></article>`:''}</section>`;}
function renderCharacterPage(s,id,portrait,tab='stats',gearSlot=null,gearPage=0){
 const h=characterById[id],owned=s.owned.includes(id),st=getCharacterStats(s,id),level=s.heroLevels[id]||1,star=s.account.stars[id]||0,cost=heroLevelCost(s,id),xp=s.heroXP[id]||0;
 const gear=slot=>{const i=s.inventory.find(i=>i.id===s.heroGear[id]?.[slot]);return {i,t:i&&itemById[i.templateId]};};
 const slots=gearSlots.map(slot=>{const {i,t}=gear(slot);return `<button class="doll-slot grade-${t?.grade||'D'}" data-pick-slot="${slot}" title="${gearSlotNames[slot]}: ${t?.name||'Trống'}">${equipmentPicture(t||{id:"empty-"+slot,name:gearSlotNames[slot],slot})}<small>${t?t.grade+' +'+i.level:gearSlotNames[slot]}</small></button>`;}).join('');
 const allStats=`<dl class="stat-grid">${Object.entries(statNames).map(([key,name])=>`<div><dt>${name}</dt><dd>${key==='crit'?(st[key]*100).toFixed(1)+'%':key==='attackSpeed'?st[key].toFixed(2)+'/s':charNumber(st[key])}</dd></div>`).join('')}</dl><p>${passiveText(h)||h.weapon}</p><p>SSR đủ 5 món: chỉ số ×3. ${st.divineSet?'✦ Đã kích hoạt':'Chưa đủ bộ'}</p>`;
 const stats=`<dl class="stat-grid">${['maxHp','physicalAtk','magicAtk','armor','resist','crit'].map(key=>`<div><dt>${statNames[key]}</dt><dd>${key==='crit'?(st[key]*100).toFixed(1)+'%':charNumber(st[key])}</dd></div>`).join('')}</dl><button data-character-tab="details">Tất cả chỉ số & nội tại</button>`;
 const skillDock=`<section class="doll-skill-dock"><h3>Kỹ năng nhân vật</h3><div>${h.skills.map((ability,index)=>`<button data-description="skill:${id}:${index}" title="${ability.name}">${skillIcon(ability)}<small>Lv.${getSkillRank(s,id,index)}</small></button>`).join('')}${h.passiveSkill?`<button data-description="skill:${id}:passive" title="${h.passiveSkill.name}">${skillIcon(h.passiveSkill)}<small>Bị động</small></button>`:''}${s.inheritance.equipped[id]?`<button data-description="manual:${s.inheritance.equipped[id]}">${skillIcon(inheritanceManuals.find(m=>m.id===s.inheritance.equipped[id]))}<small>Truyền thừa</small></button>`:''}</div></section>`;
 const growth=`<h3>Cấp ${level}/60 · ${charNumber(xp)}/${cost.xp} EXP</h3><button class="gold-button" data-level-hero="${id}" ${!owned||level>=60||xp<cost.xp?'disabled':''}>Tăng cấp · ${cost.coins} ngọc + ${cost.food} lương</button><h3>${'★'.repeat(star)}${'☆'.repeat(7-star)}</h3><p>Mảnh riêng: ${s.account.shards[id]||0} · SSR vạn năng: ${s.account.bag.ssrUniversal}</p><button class="gold-button" data-star-hero="${id}" ${!owned||star>=7?'disabled':''}>Tăng sao · ${20*(star+1)} mảnh</button><p>THẦN ${h.divine.path==='light'?'Ánh sáng':'Bóng tối'} · ${h.divine.name}</p><p>${h.divine.lore}</p>`;
 const manual=`<h3>Kỹ năng truyền thừa</h3><select data-manual-equip ${!owned?'disabled':''}><option value="">— Chưa gắn bí kíp —</option>${s.inheritance.manuals.map(mid=>`<option value="${mid}" ${s.inheritance.equipped[id]===mid?'selected':''}>${inheritanceManuals.find(m=>m.id===mid).name}</option>`).join('')}</select><button data-view="inheritance">Tìm bí kíp</button>`;
 let picker='';if(gearSlot){const entries=s.inventory.filter(i=>{const t=itemById[i.templateId];return t.slot===gearSlot&&(!t.heroId||t.heroId===id);}),pages=Math.max(1,Math.ceil(entries.length/6)),page=Math.min(gearPage,pages-1),current=gear(gearSlot);picker=`<div class="gear-curtain"><section class="gear-picker" role="dialog" aria-modal="true" aria-label="Túi trang bị"><header><h2>Túi đồ · ${gearSlotNames[gearSlot]}</h2><button data-close-gear aria-label="Đóng">✕</button></header><p>Chọn vật phẩm để đeo cho ${h.name}. Kho dùng chung với Túi Càn Khôn.</p><div class="gear-choice-grid">${entries.slice(page*6,page*6+6).map(i=>{const t=itemById[i.templateId],owner=equipmentOwner(s,i.id);return `<button data-description="gear:${i.id}" class="gear-choice grade-${t.grade}">${equipmentPicture(t)}<b>${t.name} +${i.level}</b><small>${t.grade} · ${owner?'Đang đeo: '+characterById[owner].name:'Có thể trang bị'}</small></button>`;}).join('')||'<p>Chưa có món phù hợp. Nhận quà VIP hoặc quay trang bị để bổ sung.</p>'}</div><footer><button data-gear-page="${page-1}" ${page===0?'disabled':''}>←</button><span>${page+1}/${pages} · ${entries.length} món</span><button data-gear-page="${page+1}" ${page+1===pages?'disabled':''}>→</button>${current.i?`<button data-equip-visual="">Tháo món đang đeo</button><button data-enhance="${current.i.id}" ${current.i.level>=10?'disabled':''}>Cường hóa · ${current.i.level*80} ngọc</button>`:''}<button data-view="gear-gacha">Gacha</button></footer></section></div>`;}
 return `<section class="doll-hall"><header class="doll-title"><button data-view="heroes">← Đội hình</button><h2>${h.name} <span class="grade-label grade-${h.grade}">${h.grade}</span></h2><span>${owned?'Đã sở hữu':h.vipExclusive?'Quà VIP độc quyền':'Chưa sở hữu'}</span></header><div class="doll-body"><section class="doll-stage"><div class="selected-hero-backdrop" aria-hidden="true">${characterStageArt(h)}</div><div class="doll-figure" data-description="hero:${id}">${characterStageArt(h)}</div><span class="hero-affinity-badge">${elementIcon(h.element)} Hệ ${h.element}</span><div class="doll-gear">${slots}</div><div class="doll-caption"><b>${h.title}</b><small>${h.weapon}</small><span>${'★'.repeat(star)}${'☆'.repeat(7-star)}</span><button data-team="${id}" ${!owned?'disabled':''}>${s.team.includes(id)?'Rút khỏi đội hình':'Xếp vào đội hình'}</button></div></section><section class="doll-information"><nav>${[['stats','Chỉ số'],['skills','Kỹ năng'],['growth','Cấp & sao'],['manual','Truyền thừa']].map(([key,name])=>`<button data-character-tab="${key}" class="${tab===key?'selected':''}">${name}</button>`).join('')}</nav><div class="doll-tab-content">${tab==='skills'?characterSkillList(s,h):tab==='growth'?growth:tab==='manual'?manual:tab==='details'?allStats:stats}</div>${skillDock}</section></div></section>${picker}`;
}

const inheritNumber=n=>Math.floor(n).toLocaleString('en-US');
function inheritancePage(s){const v=s.inheritance;return `<section class="page-title"><div><span class="eyebrow">BÍ CẢNH · ĐẠO THỐNG TRUYỀN THỪA</span><h1>Tầm tiên, vấn đạo.</h1><p>Thu thập ngoài thành để tìm mảnh bản đồ. Mảnh chỉ đúng cổng ẩn gần cổng không gian; thắng BOSS rồi nhận toàn bộ chiến lợi qua Hộp thư.</p></div><button class="outline-button" data-view="region">Đi thu thập tài nguyên</button></section><div class="inheritance-summary"><span>Mảnh bản đồ: ${v.fragments.length}/6</span><span>Bí cảnh đã tìm: ${v.discovered.length}/6</span><span>BOSS đã thắng: ${v.cleared.length}/6</span><span>Bí kíp đã nhận: ${v.manuals.length}/6</span></div><section class="secret-realms-grid">${secretRealms.map(r=>{const found=v.discovered.includes(r.id),cleared=v.cleared.includes(r.id),book=inheritanceManuals.find(m=>m.id===r.manualId);return `<article class="secret-realm-card ${found?'discovered':'undiscovered'}"><span class="secret-gate-icon">⌘</span><span class="eyebrow">BÍ CẢNH ${found?'ĐÃ HIỆN':'ẨN GIẤU'}</span><h2>${r.name}</h2><p>${found?'Cổng gần '+realmCities.find(c=>c.id===r.cityId).name+' · Tọa độ ('+r.x+', '+r.y+').':'Chưa xác định vị trí. Khám phá các điểm tài nguyên để tìm mảnh bản đồ.'}</p><small>BOSS: ${r.bossName} · Cấp ${r.level}<br>Truyền thừa: ${book.name}</small><button class="${found?'gold-button':'outline-button'} full" data-enter-secret="${r.id}" ${!found||s.march||s.worldAI.expedition||s.battle&&!s.battle.winner?'disabled':''}>${!found?'Cần mảnh bản đồ':cleared?'Qua cổng · BOSS đã thắng':'Qua cổng ẩn'}</button></article>`;}).join('')}</section><section class="manual-library"><h2>Bí kíp kỹ năng truyền thừa</h2><p>Một bí kíp đã học mở dùng cho mọi tướng. Mỗi tướng có một ô truyền thừa riêng, có thể dùng cùng bí kíp trên nhiều tướng. Không thay thế 3–4 chiêu chủ động hoặc bị động VIP.</p><div>${inheritanceManuals.map(m=>{const own=v.manuals.includes(m.id);return `<article class="manual-card ${own?'owned':''}"><div class="manual-card-heading">${skillIcon(m)}<div><h3>${m.name}</h3><small>Ô truyền thừa · ${Math.round(m.cost*100)} mana/nộ · Hồi ${m.cooldown}s</small></div></div><p>${m.description}</p><b>${own?'✓ Đã học':'Chưa nhận bí kíp'}</b>${own?`<label>Truyền thừa cho<select id="manual-hero-${m.id}">${s.owned.map(id=>`<option value="${id}">${characterById[id].name}</option>`).join('')}</select></label><button class="gold-button full" data-teach-manual="${m.id}" ${s.march||s.worldAI.expedition||s.battle&&!s.battle.winner?'disabled':''}>Gắn vào ô truyền thừa</button>`:'<button class="outline-button full" data-view="mail" data-open-parcels>Kiểm tra chiến lợi trong hộp thư</button>'}</article>`;}).join('')}</div></section>`;}
function secretPanel(s){const r=secretRealms.find(r=>r.id===s.inheritance.activeRealm),manual=inheritanceManuals.find(m=>m.id===r.manualId),busy=s.march||s.worldAI.expedition||s.battle&&!s.battle.winner;return `<span class="eyebrow">BÍ CẢNH · CỔNG ẨN</span><h2>${r.name}</h2><div class="secret-gate-icon">⌘</div><p>Vị trí: gần ${realmCities.find(c=>c.id===r.cityId).name} (${r.x}, ${r.y}).</p><h3>${r.bossName} · Cấp ${r.level}</h3><p>BOSS trấn giữ ${manual.name}. Toàn bộ vật phẩm, EXP và bí kíp được gửi vào chiến lợi trong hộp thư sau khi thắng, chưa cộng ngay vào túi.</p>${skillIcon(manual)}<p>${manual.description}</p><button class="gold-button full" data-secret-boss="${r.id}" ${busy?'disabled':''}>Thách đấu BOSS</button>${s.battle?.mode==='secret'&&!s.battle.winner?'<button class="outline-button full" data-view="combat">Tiếp tục trận BOSS</button>':''}<button class="outline-button full" data-leave-secret ${busy?'disabled':''}>Rời bí cảnh qua cổng</button><button class="outline-button full" data-view="mail" data-open-parcels>Chiến lợi bí cảnh trong hộp thư</button><button class="text-button" data-view="inheritance">Mảnh bản đồ & bí kíp</button>`;}

function inheritanceCast(b,actor,ability,api){const allies=actor.side==='ally'?b.allies:b.enemies,foes=actor.side==='ally'?b.enemies:b.allies,alive=units=>units.filter(u=>u.hp>0),effect=ability.manualEffect;

 if(effect==='spaceSwap'){const targets=alive(foes).sort((a,b)=>a.slot-b.slot);if(targets.length>1){const first=targets[0],last=targets[targets.length-1],slot=first.slot;first.slot=last.slot;last.slot=slot;api.event('spatialSwap',actor,'Càn Khôn Na Di đảo vị trí '+first.name+' và '+last.name+'.',[first.key,last.key]);}else if(targets[0]){targets[0].attackTimer+=2;api.event('spatialSwap',actor,'Na Di đẩy lùi nhịp đánh của '+targets[0].name+' 2 giây.',[targets[0].key]);}}

 if(effect==='rewind'){const history=b.temporalHistory||[],snapshot=history.filter(s=>s.at<=b.clock-3).at(-1)||history[0],past=snapshot?.units.find(u=>u.key===actor.key);if(past){api.heal(actor,actor,Math.max(0,past.hp-actor.hp),true);actor.mana=Math.min(actor.manaMax,Math.max(actor.mana,past.mana));actor.rage=Math.min(actor.rageMax,Math.max(actor.rage,past.rage));for(let i=0;i<actor.skillCooldowns.length;i++)if(!actor.abilities[i].manualEffect)actor.skillCooldowns[i]=Math.max(0,actor.skillCooldowns[i]-2);actor.cooldown=actor.skillCooldowns[0];}api.event('timeRewind',actor,actor.name+' quay lại trạng thái bản thân ba giây trước.');}
 if(effect==='attributeDrain'){const target=alive(foes).sort((a,b)=>b.physicalAtk+b.magicAtk-a.physicalAtk-a.magicAtk)[0];if(target){target.attributeBase??={physical:target.physicalAtk,magic:target.magicAtk};const physical=Math.max(0,Math.min(target.attributeBase.physical*.2,target.physicalAtk-target.attributeBase.physical*.5)),magic=Math.max(0,Math.min(target.attributeBase.magic*.2,target.magicAtk-target.attributeBase.magic*.5));target.physicalAtk-=physical;target.magicAtk-=magic;actor.physicalAtk+=physical;actor.magicAtk+=magic;actor.attributeLoans??=[];actor.attributeLoans.push({targetKey:target.key,physical,magic,time:6});const pool=target.resource,stolen=Math.min(25,target[pool]);target[pool]-=stolen;actor[actor.resource]=Math.min(actor.resource==='mana'?actor.manaMax:actor.rageMax,actor[actor.resource]+stolen);api.event('attributeDrain',actor,actor.name+' mượn thuộc tính của '+target.name+' trong 6 giây.',[target.key]);}}
 if(effect==='soulLink'){const units=alive(allies),pool=units.reduce((n,u)=>n+u.hp,0),capacity=units.reduce((n,u)=>n+u.maxHp-.1,0);for(const u of units){u.hp=Math.min(u.maxHp,Math.max(.1,Math.floor((.1+(pool-.1*units.length)*(u.maxHp-.1)/Math.max(.1,capacity))*10)/10));u.soulLinked=6;}let remainder=Math.round((pool-units.reduce((n,u)=>n+u.hp,0))*10)/10;for(const u of units){const add=Math.min(remainder,u.maxHp-u.hp);if(add>0){u.hp=Math.round((u.hp+add)*10)/10;remainder=Math.max(0,Math.round((remainder-add)*10)/10);}}api.event('soulLink',actor,'Hỗn Nguyên cân bằng HP, liên kết chia sẻ 15% tổn thất trong 6 giây.');}
}
function inheritanceTick(b,u,dt,api){const all=[...b.allies,...b.enemies];u.soulLinked=Math.max(0,(u.soulLinked||0)-dt);for(const loan of u.attributeLoans||[]){loan.time-=dt;if(loan.time<=.00001&&!loan.returned){const target=all.find(t=>t.key===loan.targetKey);if(target){target.physicalAtk+=loan.physical;target.magicAtk+=loan.magic;}u.physicalAtk=Math.max(1,u.physicalAtk-loan.physical);u.magicAtk=Math.max(1,u.magicAtk-loan.magic);loan.returned=true;}}u.attributeLoans=(u.attributeLoans||[]).filter(l=>!l.returned);if(u.hp<=0)return;if(u.flyingSwords?.remaining>0){u.flyingSwords.nextIn-=dt;if(u.flyingSwords.nextIn<=.00001){u.flyingSwords.nextIn+=1;u.flyingSwords.remaining--;const foes=(u.side==='ally'?b.enemies:b.allies).filter(t=>t.hp>0).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp),target=foes[0];if(target){api.hit(u,target,(u.physicalAtk+u.magicAtk)*.45/Math.max(1,u.magicAtk),'magic',{});api.event('swordFlight',u,'Phi kiếm truy kích '+target.name+'!',[target.key]);}}}

function botBattle(s,exp){if(exp.kind==='defense')exp.initialUnits=exp.units;const bot=s.worldAI.bots.find(b=>b.id===exp.targetId),base=botCities.find(b=>b.id===exp.targetId),faction=base.faction==='wei'?'Tam Quốc':base.faction==='shu'?'Tam Quốc':'Phong Thần',pool=characterRoster.filter(h=>!h.vipExclusive&&(bot.level<10?['D','C','B','A'].includes(h.grade):h.faction===faction));const count=Math.min(5,3+Math.floor(bot.level/15)),enemies=bot.troops>0?pool.slice(0,count).map(h=>h.id):[];exp.undefended=bot.troops===0;const node={id:base.id,name:base.name,siege:true,level:Math.min(3,1+Math.floor(bot.level/35)),heroLevel:Math.min(60,bot.level),skillRank:Math.min(5,1+Math.floor(bot.level/25)),enemyScale:.7+bot.level*.025,enemies};s.battle=createTacticsBattle(s,node,activeBonds(s.team).map(b=>b.id),elementalResonance(s.team));s.battle.mode='bot';s.battle.squadId=exp.squadId??0;s.battle.botId=base.id;s.battle.enemyArmyUnits=bot.troops;s.battle.deployedUnits=exp.initialUnits||60;const mass=Math.sqrt((exp.initialUnits||60)/60);for(const u of s.battle.allies){u.hp=u.maxHp=Math.round(u.maxHp*mass);u.physicalAtk=Math.round(u.physicalAtk*mass);u.magicAtk=Math.round(u.magicAtk*mass);}for(const u of s.battle.enemies){const mass=Math.max(.2,Math.min(4,Math.sqrt(bot.troops/60)));u.hp=u.maxHp=Math.round(u.maxHp*mass);u.physicalAtk*=mass;u.magicAtk*=mass;}s.battle.enemyTroopType=bot.armyType;exp.stage='combat';bot.relation=Math.max(-100,bot.relation-25);worldLog(s,'Giao chiến với '+base.name+'.');}
function worldSystemsTick(state,realDelta,simulationDelta=realDelta){const s=initDeployments(initWorld(initChronicle(structuredClone(state)))),w=s.worldAI,real=Math.max(0,Math.min(2,realDelta)),dt=Math.max(0,Math.min(5,simulationDelta));new StrongholdManager().tick(s);s.chronicle.onlineSeconds=Math.min(1000000000,s.chronicle.onlineSeconds+real);w.clock=Math.min(1000000000,w.clock+real);for(const bot of w.bots)if(w.clock>=bot.actionAt)aiDecision(s,bot);for(const n of regionalResources){const stock=w.nodes[n.id];if(stock.remaining===0&&stock.respawnAt>0&&w.clock>=stock.respawnAt){stock.remaining=2000*n.level;stock.respawnAt=0;}}

function tickRegionalMission(s,e,dt){const w=s.worldAI;if(e.kind==='stronghold'){new StrongholdManager().mission(s,e,dt);return s;}if(e.kind==='hunt'&&e.stage==='combat'){tickHuntBattle(s,e,dt);return s;}
 if(e.stage==='combat'){s.battle=tickTactics(s.battle,dt,s.autoSkill,s.dragon,s.levels.dragon);if(s.battle.winner&&!e.rewarded){const beforeUnits=e.units,won=s.battle.winner==='ally',bot=w.bots.find(b=>b.id===e.targetId);if(s.battle.winner!=='retreat')registerBattle(s,won,true);const defenderBefore=bot.troops;bot.troops=Math.max(0,bot.troops-Math.ceil(bot.troops*(won?warfareRules.defenderDefeatLoss:warfareRules.defenderWinLoss)));if(won){const level=bot.level,r={coins:0,food:0,wood:0,stone:0,playerXP:50+level*25,gold:0};if(e.undefended&&e.kind!=='defense'){for(const key of ['food','wood','stone']){r[key]=Math.min(Math.ceil(bot[key]*warfareRules.resourceLootFraction),9999999-s.resources[key]);s.resources[key]+=r[key];bot[key]-=r[key];}r.gold=50+level*warfareRules.goldLootPerLevel;addGold(s,r.gold);bot.specialItems??={co_duyen_lenh:1};if(Math.random()<warfareRules.specialLootChance){const id=Object.keys(bot.specialItems).find(id=>bot.specialItems[id]>0&&exclusiveItems.some(i=>i.id===id));if(id){bot.specialItems[id]--;s.auction.inbox.push({id:s.auction.nextId++,claimed:false,title:'Captured city treasury',asset:{kind:'bag',id,amount:1}});}}}awardPlayerXP(s,r.playerXP);grantHeroXP(s,20+level*10);s.wins++;bot.defeated++;bot.plan='defend';bot.actionAt=w.clock+8;s.worldBoss.merit=Math.min(9999999,s.worldBoss.merit+warfareRules.meritBase+level*warfareRules.meritPerLevel);new TitleManager().emit(s,{event:'merit_gained',total:s.worldBoss.merit});s.battle.reward=r;e.units=Math.round(e.units*(1-warfareRules.attackerWinLoss));}else e.units=Math.round(e.units*(1-warfareRules.attackerDefeatLoss));s.battle.casualties=recordCasualties(s,e.type,beforeUnits-e.units);s.battle.armyNumbers={alliedStarted:e.initialUnits||60,alliedRemaining:e.units,enemyStarted:s.battle.enemyArmyUnits||bot.troops,enemyRemaining:bot.troops};recordBattleMail(s,s.battle,{target:(botCities.find(c=>c.id===e.targetId)||wildlifeNodes.find(c=>c.id===e.targetId)).name,mode:e.kind==='hunt'?'hunt':'bot'});e.rewarded= const battlePlans={balanced:{name:'Cân bằng · Vượt ải',text:'Ưu tiên tiền tuyến vững, hồi phục và sát thương nhiều mục tiêu.'},boss:{name:'BOSS · Đơn mục tiêu',text:'Ưu tiên sát thương duy trì, tốc đánh và hỗ trợ sống sót.'},siege:{name:'Công thành · Diện rộng',text:'Ưu tiên chống chịu, phá hàng đầu và kỹ năng đánh nhiều địch.'},backline:{name:'Phá hậu tuyến',text:'Ưu tiên sát thủ, chí mạng và áp lực lên tướng yếu máu.'}};
function recommendFormation(s,plan='balanced'){
 if(!battlePlans[plan])plan='balanced';
 const chosen=[],reasons={};
 const score=h=>{const st=getCharacterStats(s,h.id);let value=st.physicalAtk*2+st.magicAtk*2+st.maxHp*.08+st.armor+st.resist+st.attackSpeed*25;
  if(plan==='boss')value+=st.physicalAtk*1.5+st.attackSpeed*40+(h.roles.includes('archer')?70:0);
  if(plan==='siege'||plan==='balanced')value+=h.skills.some(a=>a.operations?.some(o=>['enemyAll','enemyFront','enemyColumn'].includes(o.target)))?70:0;
  if(plan==='backline')value+=(h.roles.includes('assassin')?240:0)+st.crit*200;
  for(const b of bonds)if(b.ids.includes(h.id))value+=b.ids.filter(id=>chosen.includes(id)).length*75;
  return value;};
 function pick(predicate,reason){const pool=s.owned.map(id=>characterById[id]).filter(h=>h&&!chosen.includes(h.id)&&predicate(h)).sort((a,b)=>score(b)-score(a)||a.id.localeCompare(b.id));if(pool[0]){chosen.push(pool[0].id);reasons[pool[0].id]=reason;}}
 pick(h=>h.roles.includes('tank'),'Chống chịu, giữ hàng đầu');
 pick(h=>h.roles.includes('support'),'Hồi phục hoặc bảo vệ toàn đội');
 if(plan==='backline')pick(h=>h.roles.includes('assassin'),'Áp lực hậu tuyến địch');
 while(chosen.length<Math.min(5,s.owned.length)){const n=chosen.length;pick(()=>true,'Sát thương và phối hợp theo chỉ số hiện tại');if(n===chosen.length)break;}
 const formation=Array(9).fill(null);
 const sorted=chosen.slice().sort((a,b)=>Number(characterById[b].roles.includes('tank'))-Number(characterById[a].roles.includes('tank')));
 for(const id of sorted){const h=characterById[id];const rows=h.roles.includes('tank')?[0,1,2]:h.roles.includes('support')||h.roles.includes('archer')?[2,1,0]:h.roles.includes('fighter')?[0,1,2]:[1,2,0];for(const row of rows){const slot=[0,1,2].map(c=>row*3+c).find(i=>!formation[i]);if(slot!==undefined){formation[slot]=id;break;}}}
 return{plan,formation,reasons,bonds:bonds.filter(b=>b.ids.filter(id=>chosen.includes(id)).length>=(b.required||b.ids.length))};
}

}

function renderDescription(s,key,portrait,context={},page=0,fallback=null){const d=fallback||galleryDescriptionData(s,key,portrait,context);if(!d)return '';const pages=Math.max(1,Math.ceil(d.lines.length/7)),p=Math.min(page,pages-1);return `<div class="description-curtain"><section class="description-dialog" role="dialog" aria-modal="true" aria-label="${escapeAccountText(d.name)}"><header><h2>${escapeAccountText(d.name)}</h2><button data-close-description aria-label="Đóng mô tả">✕</button></header><div class="description-body"><div class="description-art">${d.art}</div><div class="description-copy">${d.lines.slice(p*7,p*7+7).map(line=>`<p>${escapeAccountText(line)}</p>`).join('')}</div></div><footer>${d.actions||''}${pages>1?`<button data-description-page="${p-1}" ${p===0?'disabled':''}>←</button><span>${p+1}/${pages}</span><button data-description-page="${p+1}" ${p+1===pages?'disabled':''}>→</button>`:''}<button data-close-description>Đóng</button></footer></section></div>`;}

function availableAdvisorHeroes(s){const busy=new Set(deployments(s).flatMap(e=>e.formation.filter(Boolean)));return s.owned.filter(id=>heroAssignedElsewhere(s,id)<0&&!busy.has(id));}
function effectiveFormationPower(s,formation,waves=[{element:'none'}],now=Date.now()){
 const b=createTacticsBattle({...s,formation,team:formation.filter(Boolean)},{id:'advisor-preview',name:'Formation preview',level:1,enemies:[],now});const powers=waves.map(w=>b.allies.reduce((n,u)=>n+u.maxHp+5*(u.physicalAtk+u.magicAtk)*elementalMultiplier(u.element,w.element)*(w.guard?.element===u.element?1-w.guard.reduction:1)+3*(u.armor+u.resist),0));return{effectivePower:Math.round(powers.reduce((a,b)=>a+b,0)/Math.max(1,powers.length)),wavePowers:powers.map(Math.round),synergy:b.teamSynergy};
}
class FormationAdvisor{
 suggest(s,target={waves:[{element:'none',power:1}]},{now=Date.now(),clock=()=>performance.now()}={}){
  const start=clock(),allowed=availableAdvisorHeroes(s),stats=Object.fromEntries(allowed.map(id=>[id,getCharacterStats(s,id)])),waves=target.waves?.length?target.waves:[{element:'none',power:target.power||1}],slots=[0,2,6,7,8],width=elementRules.advisor.beamWidth,limit=elementRules.advisor.budgetMs,calc=new TeamSynergyCalculator(),results=[];
  const heroPower=id=>{const u=stats[id];return u.maxHp+5*(u.physicalAtk+u.magicAtk)+3*(u.armor+u.resist);};
  for(const strategy of ['Counter Advantage','Safe','Balanced']){
   let beam=[{ids:[],formation:Array(9).fill(null),score:0}];for(let depth=0;depth<Math.min(5,allowed.length);depth++){const next=[];for(const partial of beam){for(const id of allowed){if(partial.ids.includes(id))continue;const formation=[...partial.formation];formation[slots[depth]]=id;const units=formation.flatMap((id,slot)=>id?[{id,slot,element:characterById[id].element}]:[]),synergy=calc.calculate(units,{now});let score=0,worst=Infinity;for(const wave of waves){let value=0;for(const u of synergy.units){const st=stats[u.id],attack=(st.physicalAtk+st.magicAtk)*5*(1+u.attack)*elementalMultiplier(u.element,wave.element)*(wave.guard?.element===u.element?1-wave.guard.reduction:1),hp=st.maxHp*(1+u.health);value+=strategy==='Safe'?hp*1.6+attack*.8:strategy==='Counter Advantage'?attack*1.5+hp*.7:hp+attack;}score+=value;worst=Math.min(worst,value/Math.max(1,wave.power||target.power||1));}score/=waves.length;if(worst<elementRules.advisor.badWaveRatio)score*=.8;next.push({ids:[...partial.ids,id],formation,score});}if(clock()-start>=limit*.7&&next.length)break;}next.sort((a,b)=>b.score-a.score);beam=next.slice(0,width);if(!beam.length)break;}
   const complete=beam.filter(c=>c.ids.length===Math.min(5,allowed.length)),candidate=complete.find(c=>results.every(r=>c.ids.filter(id=>!r.ids.includes(id)).length>=Math.min(2,Math.max(0,allowed.length-5))))||complete[0];if(candidate&&!results.some(r=>r.ids.slice().sort().join()===candidate.ids.slice().sort().join())){const actual=effectiveFormationPower(s,candidate.formation,waves,now),ratio=actual.effectivePower/Math.max(1,target.power||waves.reduce((n,w)=>n+(w.power||1),0)/waves.length);results.push({...candidate,...actual,label:strategy,difficulty:ratio>=1.2?'Easy':ratio>=.9?'Moderate':'Hard',winChance:ratio>=1.2?'High':ratio>=.9?'Medium':'Low',reasons:waves.slice(0,3).map((w,i)=>'Wave '+(i+1)+': '+w.element+' · '+candidate.ids.filter(id=>overcomes(characterById[id].element,w.element)).length+' counter heroes')});}
  }return results.slice(0,3);
 }
}
function saveFormationTemplate(state,name){const s=structuredClone(state);initFormationSaves(s);if(!s.team.length||s.savedFormations.entries.length>=5||typeof name!=='string'||!name.trim()||name.length>24||/[<>\x00-\x1f]/.test(name))throw new Error('Use a name of 1–24 characters; keep at most five templates.');s.savedFormations.entries.push({name:name.trim(),slots:[...s.formation]});return s;}
